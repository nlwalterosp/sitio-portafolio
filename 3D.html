<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Canto del Quetzal | Experiencia Parallax 3D</title>
    
    <!-- Tipografías del portafolio -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --cyan-glow: #00f2fe;
            --cyan-dim: rgba(0, 242, 254, 0.45);
            --cyan-bg: rgba(10, 26, 38, 0.72);
            --sand-header: #ede6d3;
            --sand-text: #2c2923;
            --orange-card: #f26829;
            --font-display: "Inter Tight", sans-serif;
            --font-body: "Inter", sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            min-height: 100%;
            background-color: #0c1219;
            color: #fff;
            font-family: var(--font-body);
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #090e14; }
        ::-webkit-scrollbar-thumb { background: #00f2fe44; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #00f2fe88; }

        /* HEADER ORGÁNICO SUPERIOR */
        .site-header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            pointer-events: none;
            transition: transform 0.3s ease;
        }

        .header-curve-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 85px;
            background: var(--sand-header);
            border-bottom-left-radius: 45% 25px;
            border-bottom-right-radius: 45% 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
            z-index: 1;
        }

        .header-content {
            position: relative;
            z-index: 2;
            pointer-events: auto;
            max-width: 1400px;
            margin: 0 auto;
            padding: 14px 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: var(--sand-text);
        }

        .brand-logo img {
            height: 42px;
            width: auto;
            object-fit: contain;
        }

        .brand-title h1 {
            font-family: var(--font-display);
            font-size: 1.35rem;
            font-weight: 900;
            letter-spacing: 0.5px;
            color: #1a4231;
            line-height: 1;
            text-transform: uppercase;
        }

        .brand-title span {
            font-family: var(--font-display);
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 2.5px;
            color: #2b7a59;
            text-transform: uppercase;
            margin-top: 2px;
        }

        .main-nav {
            display: flex;
            align-items: center;
            gap: 26px;
        }

        .main-nav a {
            text-decoration: none;
            font-family: var(--font-display);
            font-size: 0.85rem;
            font-weight: 700;
            color: #444037;
            padding: 6px 12px;
            border-radius: 20px;
            transition: all 0.25s ease;
        }

        .main-nav a:hover {
            color: #0b2216;
            background: rgba(0, 0, 0, 0.06);
            transform: translateY(-1px);
        }

        .main-nav a.btn-back {
            background: #1a4231;
            color: #fff;
            padding: 8px 18px;
        }

        .main-nav a.btn-back:hover {
            background: #000;
            color: #00f2fe;
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.3);
        }

        /* HUD LATERAL DE PROFUNDIDAD */
        .depth-meter {
            position: fixed;
            right: 28px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 900;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 16px;
            pointer-events: auto;
        }

        .depth-track {
            position: relative;
            width: 2px;
            height: 240px;
            background: rgba(255, 255, 255, 0.12);
            border-radius: 2px;
            overflow: hidden;
            margin-right: 12px;
        }

        .depth-fill {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 0%;
            background: linear-gradient(180deg, var(--cyan-glow), #00a8ff);
            box-shadow: 0 0 12px var(--cyan-glow);
            transition: height 0.1s ease-out;
        }

        .depth-node {
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: var(--font-display);
            font-size: 0.68rem;
            font-weight: 700;
            letter-spacing: 1px;
            color: rgba(255, 255, 255, 0.4);
            cursor: pointer;
            transition: all 0.3s ease;
            background: transparent;
            border: none;
        }

        .depth-node .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transition: all 0.3s ease;
        }

        .depth-node:hover, .depth-node.active {
            color: var(--cyan-glow);
            text-shadow: 0 0 8px var(--cyan-glow);
        }

        .depth-node:hover .dot, .depth-node.active .dot {
            background: var(--cyan-glow);
            box-shadow: 0 0 10px var(--cyan-glow);
            transform: scale(1.6);
        }

        /* ESCENARIO DEL PARALLAX 3D */
        .parallax-viewport {
            position: relative;
            width: 100%;
            height: 5400px;
            overflow: hidden;
            perspective: 1200px;
            perspective-origin: center center;
        }

        .parallax-stage {
            position: sticky;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            overflow: hidden;
            transform-style: preserve-3d;
        }

        /* REGLA PRINCIPAL: position: absolute y z-index */
        .parallax-layer {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 1600px;
            height: 100%;
            pointer-events: none;
            will-change: transform;
            transform-origin: center center;
        }

        .parallax-layer img {
            width: 100%;
            height: auto;
            display: block;
            user-select: none;
        }

        /* CAPAS INDIVIDUALES */
        .layer-sky { z-index: 1; top: -50px; max-width: 100%; }
        .layer-sky img { width: 100%; height: 120vh; object-fit: cover; }
        .layer-mountains { z-index: 2; top: 15vh; opacity: 0.9; }
        .layer-temples { z-index: 3; top: 22vh; }
        .layer-waterfall {
            z-index: 4;
            top: 30vh;
            left: 50%;
            width: 55%;
            max-width: 820px;
            mix-blend-mode: screen;
            filter: drop-shadow(0 0 25px rgba(0, 242, 254, 0.35));
        }
        .layer-midground-rocks { z-index: 5; top: 10vh; }
        .layer-hero-princess {
            z-index: 6;
            top: 12vh;
            max-width: 1100px;
            filter: drop-shadow(0 20px 40px rgba(0, 0, 0, 0.7));
        }
        .layer-interactive-hud {
            z-index: 7;
            width: 100%;
            max-width: 1440px;
            pointer-events: auto;
        }
        .layer-foreground-rocks {
            z-index: 10;
            top: 5vh;
            filter: drop-shadow(0 30px 60px rgba(0, 0, 0, 0.85));
        }

        /* TARJETAS HUD FLOTANTES */
        .hud-card {
            position: absolute;
            background: var(--cyan-bg);
            border: 1.5px solid var(--cyan-dim);
            border-radius: 22px;
            box-shadow: 0 15px 45px rgba(0,0,0,0.65), 0 0 30px rgba(0, 242, 254, 0.2), inset 0 0 20px rgba(0, 242, 254, 0.08);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            overflow: hidden;
            pointer-events: auto;
            cursor: pointer;
            transition: transform 0.35s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.35s ease, border-color 0.35s ease;
        }

        .hud-card:hover {
            transform: translateY(-8px) scale(1.02);
            border-color: var(--cyan-glow);
            box-shadow: 0 25px 60px rgba(0,0,0,0.8), 0 0 45px rgba(0, 242, 254, 0.45);
        }

        .hud-card img { width: 100%; height: auto; display: block; border-radius: 18px; }

        .hud-accent-lines { position: absolute; display: flex; gap: 4px; pointer-events: none; }
        .hud-accent-lines span { width: 24px; height: 3px; background: var(--cyan-glow); transform: skewX(-35deg); box-shadow: 0 0 8px var(--cyan-glow); }
        .hud-chevrons { color: var(--cyan-glow); font-size: 0.85rem; letter-spacing: 3px; text-shadow: 0 0 8px var(--cyan-glow); }

        #card-concept-art { top: 28%; right: 4%; width: 440px; padding: 12px; }
        #card-mini-pose { top: 30%; left: 3%; width: 180px; padding: 8px; border-radius: 16px; }
        #card-palette-gear { top: 42%; left: 2%; width: 460px; padding: 12px; }
        #card-lore-seal { top: 40%; right: 3%; width: 420px; padding: 12px; }

        .holo-wireframe-cluster {
            position: absolute;
            top: 60%;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 24px;
            align-items: flex-end;
            pointer-events: auto;
        }

        .holo-panel {
            position: relative;
            width: 170px;
            background: rgba(0, 242, 254, 0.06);
            border: 1.5px solid rgba(0, 242, 254, 0.65);
            border-radius: 14px;
            padding: 8px;
            backdrop-filter: blur(8px);
            box-shadow: 0 0 25px rgba(0, 242, 254, 0.25);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .holo-panel:hover { transform: translateY(-10px) scale(1.05); border-color: #fff; box-shadow: 0 0 35px var(--cyan-glow); }
        .holo-panel .holo-tag { font-family: var(--font-display); font-size: 0.75rem; font-weight: 800; color: var(--cyan-glow); letter-spacing: 2px; text-align: center; margin-bottom: 6px; }
        .holo-panel img { width: 100%; height: auto; mix-blend-mode: screen; filter: brightness(1.2) drop-shadow(0 0 10px rgba(0, 242, 254, 0.5)); }

        #speeder-water-rush {
            position: absolute;
            top: 54%;
            left: 48%;
            transform: translateX(-50%);
            width: 480px;
            pointer-events: none;
            filter: drop-shadow(0 0 30px rgba(0, 242, 254, 0.6));
            animation: speederHover 4s ease-in-out infinite alternate;
        }

        @keyframes speederHover {
            0% { transform: translateX(-50%) translateY(0px) rotate(-1deg); }
            100% { transform: translateX(-50%) translateY(-12px) rotate(1deg); }
        }

        #card-dossier { top: 74%; right: 4%; width: 450px; padding: 12px; }
        #card-speeder-orange {
            top: 84%;
            left: 3%;
            width: 430px;
            background: linear-gradient(135deg, #f26829 0%, #c9440c 100%);
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 26px;
            padding: 14px;
            box-shadow: 0 20px 50px rgba(242, 104, 41, 0.45);
        }

        #render-nevera-ruins {
            position: absolute;
            top: 84%;
            right: 12%;
            width: 260px;
            pointer-events: auto;
            cursor: pointer;
            filter: drop-shadow(0 20px 40px rgba(0,0,0,0.8));
            transition: transform 0.4s ease;
        }
        #render-nevera-ruins:hover { transform: scale(1.06) translateY(-5px); }

        /* LIGHTBOX MODAL */
        .lightbox-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(5, 12, 18, 0.92);
            backdrop-filter: blur(16px);
            z-index: 5000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .lightbox-modal.active { opacity: 1; pointer-events: auto; }
        .lightbox-container {
            position: relative;
            max-width: 90vw;
            max-height: 88vh;
            border: 2px solid var(--cyan-glow);
            border-radius: 20px;
            padding: 10px;
            background: rgba(10, 20, 30, 0.85);
            box-shadow: 0 0 50px rgba(0, 242, 254, 0.4);
            transform: scale(0.9);
            transition: transform 0.3s ease;
        }
        .lightbox-modal.active .lightbox-container { transform: scale(1); }
        .lightbox-img { max-width: 100%; max-height: 80vh; object-fit: contain; border-radius: 14px; display: block; }
        .lightbox-caption { margin-top: 10px; text-align: center; font-family: var(--font-display); font-size: 0.95rem; color: var(--cyan-glow); }
        .lightbox-close {
            position: absolute;
            top: -18px;
            right: -18px;
            width: 40px;
            height: 40px;
            background: var(--cyan-glow);
            color: #000;
            border: none;
            border-radius: 50%;
            font-size: 1.2rem;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 0 15px var(--cyan-glow);
        }

        .scroll-indicator {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            color: rgba(255, 255, 255, 0.6);
            font-family: var(--font-display);
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }
        .scroll-mouse {
            width: 22px;
            height: 36px;
            border: 2px solid var(--cyan-glow);
            border-radius: 12px;
            position: relative;
        }
        .scroll-wheel {
            position: absolute;
            top: 6px;
            left: 50%;
            transform: translateX(-50%);
            width: 4px;
            height: 8px;
            background: var(--cyan-glow);
            border-radius: 2px;
            animation: mouseScroll 1.6s infinite ease-in-out;
        }
        @keyframes mouseScroll {
            0% { transform: translateX(-50%) translateY(0); opacity: 1; }
            80% { transform: translateX(-50%) translateY(14px); opacity: 0; }
            100% { transform: translateX(-50%) translateY(0); opacity: 0; }
        }

        @media (max-width: 1200px) {
            .hud-card { width: 360px !important; }
            #card-concept-art { top: 25%; right: 2%; }
            #card-palette-gear { top: 40%; left: 1%; }
            #card-lore-seal { top: 42%; right: 1%; }
            .holo-panel { width: 130px; }
        }

        @media (max-width: 768px) {
            .main-nav { display: none; }
            .depth-meter { display: none; }
            .hud-card { position: relative !important; width: 92% !important; margin: 30px auto !important; }
            .holo-wireframe-cluster { position: relative !important; margin: 40px auto !important; justify-content: center; }
        }
    </style>
</head>
<body>

    <header class="site-header">
        <div class="header-curve-bg"></div>
        <div class="header-content">
            <a href="index.html" class="brand-logo">
                <img src="images/LOGO-UNIDO.png" alt="Logo El Canto del Quetzal">
                <div class="brand-title">
                    <h1>El Canto</h1>
                    <span>Del Quetzal</span>
                </div>
            </a>

            <nav class="main-nav">
                <a href="#cumbre" onclick="scrollToDepth(0)">Cumbre Maya</a>
                <a href="#cascada" onclick="scrollToDepth(0.3)">Cascada</a>
                <a href="#laguna" onclick="scrollToDepth(0.58)">Laguna 3D</a>
                <a href="#santuario" onclick="scrollToDepth(0.85)">Santuario</a>
                <a href="Ilustracion.html">Ilustración</a>
                <a href="bio.html">Bio</a>
                <a href="index.html" class="btn-back">&#8592; Menú Principal</a>
            </nav>
        </div>
    </header>

    <aside class="depth-meter">
        <div class="depth-track">
            <div class="depth-fill" id="depthFill"></div>
        </div>
        <button class="depth-node active" data-depth="0" onclick="scrollToDepth(0)">
            <span>01 // CUMBRE</span>
            <div class="dot"></div>
        </button>
        <button class="depth-node" data-depth="0.32" onclick="scrollToDepth(0.32)">
            <span>02 // CASCADA</span>
            <div class="dot"></div>
        </button>
        <button class="depth-node" data-depth="0.60" onclick="scrollToDepth(0.60)">
            <span>03 // LAGUNA HUD</span>
            <div class="dot"></div>
        </button>
        <button class="depth-node" data-depth="0.88" onclick="scrollToDepth(0.88)">
            <span>04 // SANTUARIO</span>
            <div class="dot"></div>
        </button>
    </aside>

    <div class="scroll-indicator" id="scrollCue">
        <div class="scroll-mouse"><div class="scroll-wheel"></div></div>
        <span>Haz Scroll para Explorar</span>
    </div>

    <!-- ESCENARIO DEL PARALLAX 3D (CAPAS APILADAS) -->
    <div class="parallax-viewport" id="parallaxViewport">
        <div class="parallax-stage" id="parallaxStage">

            <!-- Capa 1: Cielo y fondo -->
            <div class="parallax-layer layer-sky" data-speed="0.12" data-depth-z="-200">
                <img src="images/fondo3.png" alt="Cielo del Cañón">
            </div>

            <!-- Capa 2: Montañas del fondo -->
            <div class="parallax-layer layer-mountains" data-speed="0.22" data-depth-z="-120">
                <img src="images/montañas-del-fondo.png" alt="Montañas lejanas">
            </div>

            <!-- Capa 3: Templos y pirámides mayas -->
            <div class="parallax-layer layer-temples" data-speed="0.34" data-depth-z="-60">
                <img src="images/edificios 3.png" alt="Templos Mayas">
            </div>

            <!-- Capa 4: Cascada central -->
            <div class="parallax-layer layer-waterfall" data-speed="0.52" data-depth-z="-20">
                <img src="images/Cascada en cañón entre rocas.png" alt="Cascada entre rocas">
            </div>

            <!-- Capa 5: Segundo plano de rocas -->
            <div class="parallax-layer layer-midground-rocks" data-speed="0.44" data-depth-z="0">
                <img src="images/segundo_plano_cascada_transparente.png" alt="Paredes del cañón">
            </div>

            <!-- Capa 6: Princesa Ixk'uk y Espíritu de Quetzal -->
            <div class="parallax-layer layer-hero-princess" data-speed="0.40" data-depth-z="40">
                <img src="images/princesa dibujo quetzal sin fondo.png" alt="Princesa Ixk'uk">
            </div>

            <!-- Capa 7: Módulos interactivos HUD -->
            <div class="parallax-layer layer-interactive-hud" data-speed="0.58" data-depth-z="80">

                <div class="hud-card" id="card-concept-art" onclick="openLightbox('images/princesa-diapo1.png', 'Concept Art: Expresiones y Hoja de Modelo')">
                    <div class="hud-chevrons">&gt;&gt;&gt;&gt;</div>
                    <img src="images/princesa-diapo1.png" alt="Concept Art Expresiones">
                </div>

                <div class="hud-card" id="card-mini-pose" onclick="openLightbox('images/princesa dibujo3.png', 'Estudio de Poses Dinámicas')">
                    <img src="images/princesa dibujo3.png" alt="Pose Princesa">
                    <div class="hud-accent-lines" style="bottom: 8px; left: 10px;"><span></span><span></span><span></span></div>
                </div>

                <div class="hud-card" id="card-palette-gear" onclick="openLightbox('images/princesa-diapo2.png', 'Diseño de Vestuario, Colores y Accesorios')">
                    <img src="images/princesa-diapo2.png" alt="Paleta de Color y Vestuario">
                </div>

                <div class="hud-card" id="card-lore-seal" onclick="openLightbox('images/princesa-diapo3.png', 'Sello del Quetzal y Lore de la Princesa Ixk\'uk')">
                    <img src="images/princesa-diapo3.png" alt="Lore y Sello">
                </div>

                <div id="speeder-water-rush">
                    <img src="images/render de moto5.png" alt="Speeder en el agua">
                </div>

                <div class="holo-wireframe-cluster">
                    <div class="holo-panel" onclick="openLightbox('images/render amiga1w.png', 'Proyección Holográfica // Vista Frontal')">
                        <div class="holo-tag">Front</div>
                        <img src="images/render amiga1w.png" alt="Wireframe Frontal">
                    </div>
                    <div class="holo-panel" onclick="openLightbox('images/render amiga2w.png', 'Proyección Holográfica // Vista Posterior')">
                        <div class="holo-tag">Back</div>
                        <img src="images/render amiga2w.png" alt="Wireframe Posterior">
                    </div>
                    <div class="holo-panel" onclick="openLightbox('images/render amiga3w.png', 'Proyección Holográfica // Vista Lateral')">
                        <div class="holo-tag">Side</div>
                        <img src="images/render amiga3w.png" alt="Wireframe Lateral">
                    </div>
                </div>

                <div class="hud-card" id="card-dossier" onclick="openLightbox('images/render princesa 2.png', 'Ficha Técnica // Renders de Personaje 3D')">
                    <img src="images/render princesa 2.png" alt="Ficha Técnica Princesa">
                </div>

                <div class="hud-card" id="card-speeder-orange" onclick="openLightbox('images/render de moto6.png', 'Render de Estudio // Speeder Biomecánico')">
                    <img src="images/render de moto6.png" alt="Studio Speeder Render">
                </div>

                <div id="render-nevera-ruins" onclick="openLightbox('images/RENDER_PRINCESA_NEVERA.png', 'Exploración de las Ruinas Subterráneas')">
                    <img src="images/RENDER_PRINCESA_NEVERA.png" alt="Princesa en Ruinas">
                </div>
            </div>

            <!-- Capa 8: Primer plano (Rocas frontales) -->
            <div class="parallax-layer layer-foreground-rocks" data-speed="0.88" data-depth-z="140">
                <img src="images/primer_plano_cascada_transparente.png" alt="Rocas del primer plano">
            </div>

        </div>
    </div>

    <!-- LIGHTBOX MODAL -->
    <div class="lightbox-modal" id="lightboxModal" onclick="closeLightbox(event)">
        <div class="lightbox-container" onclick="event.stopPropagation()">
            <button class="lightbox-close" onclick="closeLightbox()">&times;</button>
            <img class="lightbox-img" id="lightboxImg" src="" alt="Vista ampliada">
            <div class="lightbox-caption" id="lightboxCaption"></div>
        </div>
    </div>

    <!-- SCRIPT PARALLAX 3D INTERACTIVO -->
    <script>
        const layers = document.querySelectorAll('.parallax-layer');
        const viewport = document.getElementById('parallaxViewport');
        const depthFill = document.getElementById('depthFill');
        const depthNodes = document.querySelectorAll('.depth-node');
        const scrollCue = document.getElementById('scrollCue');
        const stage = document.getElementById('parallaxStage');

        let currentScrollY = 0;
        let targetScrollY = 0;
        let mouseX = 0;
        let mouseY = 0;
        let targetMouseX = 0;
        let targetMouseY = 0;

        function getMaxScroll() {
            return viewport.scrollHeight - window.innerHeight;
        }

        // Escuchador de scroll de ventana
        window.addEventListener('scroll', () => {
            targetScrollY = window.pageYOffset || document.documentElement.scrollTop;
            if (targetScrollY > 100 && scrollCue) {
                scrollCue.style.opacity = '0';
            } else if (targetScrollY <= 100 && scrollCue) {
                scrollCue.style.opacity = '1';
            }
        }, { passive: true });

        // Escuchador de movimiento de cursor para perspectiva 3D
        window.addEventListener('mousemove', (e) => {
            const halfW = window.innerWidth / 2;
            const halfH = window.innerHeight / 2;
            targetMouseX = (e.clientX - halfW) / halfW;
            targetMouseY = (e.clientY - halfH) / halfH;
        });

        // Bucle de animación suave a 60/120 FPS
        function animateParallax() {
            currentScrollY += (targetScrollY - currentScrollY) * 0.085;
            mouseX += (targetMouseX - mouseX) * 0.05;
            mouseY += (targetMouseY - mouseY) * 0.05;

            const maxScroll = getMaxScroll();
            const scrollProgress = Math.min(Math.max(currentScrollY / (maxScroll || 1), 0), 1);

            if (depthFill) {
                depthFill.style.height = `${scrollProgress * 100}%`;
            }

            depthNodes.forEach(node => {
                const nodeDepth = parseFloat(node.getAttribute('data-depth'));
                if (Math.abs(scrollProgress - nodeDepth) < 0.16) {
                    node.classList.add('active');
                } else {
                    node.classList.remove('active');
                }
            });

            // Inclinación 3D del escenario según el ratón
            const stageRotateX = -mouseY * 2.5;
            const stageRotateY = mouseX * 3.5;
            stage.style.transform = `rotateX(${stageRotateX}deg) rotateY(${stageRotateY}deg)`;

            // Desplazamiento translateY individual por capa
            layers.forEach(layer => {
                const speed = parseFloat(layer.getAttribute('data-speed')) || 0.5;
                const depthZ = parseFloat(layer.getAttribute('data-depth-z')) || 0;

                const translateY = -currentScrollY * speed;
                const mouseOffsetX = mouseX * (depthZ * 0.35);
                const mouseOffsetY = mouseY * (depthZ * 0.2);

                layer.style.transform = `translate3d(calc(-50% + ${mouseOffsetX.toFixed(2)}px), ${(translateY + mouseOffsetY).toFixed(2)}px, ${depthZ}px)`;
            });

            requestAnimationFrame(animateParallax);
        }

        requestAnimationFrame(animateParallax);

        function scrollToDepth(progress) {
            const maxScroll = getMaxScroll();
            window.scrollTo({
                top: maxScroll * progress,
                behavior: 'smooth'
            });
        }

        const modal = document.getElementById('lightboxModal');
        const modalImg = document.getElementById('lightboxImg');
        const modalCaption = document.getElementById('lightboxCaption');

        function openLightbox(src, caption) {
            if (!modal || !modalImg) return;
            modalImg.src = src;
            modalCaption.textContent = caption || '';
            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox(e) {
            if (!modal) return;
            modal.classList.remove('active');
            document.body.style.overflow = '';
            setTimeout(() => {
                if (modalImg) modalImg.src = '';
            }, 300);
        }

        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && modal.classList.contains('active')) {
                closeLightbox();
            }
        });
    </script>
</body>
</html>
