<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Canto del Quetzal | Landing Page Parallax 3D</title>
    
    <!-- Tipografías oficiales -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        /* ==========================================================
           1. RESET Y CONFIGURACIÓN BASE
           ========================================================== */
        :root {
            --cyan-neon: #00f2fe;
            --cyan-glow: rgba(0, 242, 254, 0.45);
            --cyan-glass: rgba(12, 26, 38, 0.82);
            --sand-header: #ede6d3;
            --sand-text: #2c2923;
            --canyon-dark: #0d141c;
            --font-display: "Inter Tight", sans-serif;
            --font-body: "Inter", sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
            background-color: var(--canyon-dark);
        }

        body {
            width: 100%;
            min-height: 100vh;
            background-color: var(--canyon-dark);
            color: #ffffff;
            font-family: var(--font-body);
            overflow-x: hidden;
            position: relative;
        }

        /* Scrollbar estilizada */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #090e14;
        }
        ::-webkit-scrollbar-thumb {
            background: #00f2fe55;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #00f2feaa;
        }

        /* ==========================================================
           2. HEADER ORGÁNICO SUPERIOR (ESTILO REFERENCIA)
           ========================================================== */
        .site-header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            pointer-events: none;
            transition: transform 0.3s ease;
        }

        .header-curve-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 85px;
            background: var(--sand-header);
            border-bottom-left-radius: 45% 25px;
            border-bottom-right-radius: 45% 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
            z-index: 1;
        }

        .header-content {
            position: relative;
            z-index: 2;
            pointer-events: auto;
            max-width: 1440px;
            margin: 0 auto;
            padding: 14px 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 14px;
            text-decoration: none;
            color: var(--sand-text);
        }

        .brand-logo img {
            height: 42px;
            width: auto;
            object-fit: contain;
        }

        .brand-title {
            display: flex;
            flex-direction: column;
        }

        .brand-title h1 {
            font-family: var(--font-display);
            font-size: 1.35rem;
            font-weight: 900;
            letter-spacing: 0.5px;
            color: #1a4231;
            line-height: 1;
            text-transform: uppercase;
        }

        .brand-title span {
            font-family: var(--font-display);
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 2.5px;
            color: #2b7a59;
            text-transform: uppercase;
            margin-top: 2px;
        }

        .main-nav {
            display: flex;
            align-items: center;
            gap: 24px;
        }

        .main-nav a {
            text-decoration: none;
            font-family: var(--font-display);
            font-size: 0.85rem;
            font-weight: 700;
            color: #444037;
            padding: 6px 14px;
            border-radius: 20px;
            transition: all 0.25s ease;
        }

        .main-nav a:hover {
            color: #0b2216;
            background: rgba(0, 0, 0, 0.08);
            transform: translateY(-1px);
        }

        .main-nav a.btn-back {
            background: #1a4231;
            color: #ffffff;
            padding: 8px 18px;
        }

        .main-nav a.btn-back:hover {
            background: #000000;
            color: var(--cyan-neon);
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.35);
        }

        /* ==========================================================
           3. HUD LATERAL DE PROFUNDIDAD (PROGRESS TRACKER)
           ========================================================== */
        .depth-meter {
            position: fixed;
            right: 28px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 900;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 16px;
            pointer-events: auto;
        }

        .depth-track {
            position: relative;
            width: 2px;
            height: 240px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 2px;
            overflow: hidden;
            margin-right: 12px;
        }

        .depth-fill {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 0%;
            background: linear-gradient(180deg, var(--cyan-neon), #00a8ff);
            box-shadow: 0 0 12px var(--cyan-neon);
            transition: height 0.1s ease-out;
        }

        .depth-node {
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: var(--font-display);
            font-size: 0.68rem;
            font-weight: 700;
            letter-spacing: 1px;
            color: rgba(255, 255, 255, 0.4);
            cursor: pointer;
            transition: all 0.3s ease;
            background: transparent;
            border: none;
        }

        .depth-node .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transition: all 0.3s ease;
        }

        .depth-node:hover,
        .depth-node.active {
            color: var(--cyan-neon);
            text-shadow: 0 0 8px var(--cyan-neon);
        }

        .depth-node:hover .dot,
        .depth-node.active .dot {
            background: var(--cyan-neon);
            box-shadow: 0 0 10px var(--cyan-neon);
            transform: scale(1.6);
        }

        /* ==========================================================
           4. ESCENARIO VERTICAL DE LA LANDING PAGE
           ========================================================== */
        .landing-container {
            position: relative;
            width: 100%;
            min-height: 5200px;
            background: linear-gradient(180deg, #99b6c4 0%, #172430 800px, #0f1821 2200px, #0c1219 4000px, #090e14 100%);
            overflow: visible;
        }

        /* Lienzo central con el ancho de la ilustración de referencia */
        .canyon-canvas {
            position: relative;
            width: 100%;
            max-width: 1360px;
            height: 5200px;
            margin: 0 auto;
            overflow: visible;
        }

        /* Capas base usando position: absolute y z-index */
        .layer {
            position: absolute;
            pointer-events: none;
            will-change: transform;
            transition: transform 0.08s ease-out;
        }

        .layer img {
            width: 100%;
            height: auto;
            display: block;
            user-select: none;
        }

        .center-x {
            left: 50%;
            transform: translateX(-50%);
        }

        /* ==========================================================
           5. APILAMIENTO EXACTO DE CAPAS DEL PAISAJE (Z-INDEX)
           ========================================================== */

        /* 1. Montañas del fondo (Hero superior) */
        #layer-mountains {
            top: 60px;
            width: 100%;
            max-width: 1360px;
            z-index: 2;
            opacity: 0.95;
        }

        /* 2. Templos Mayas y Tanque mecha en la cumbre */
        #layer-temples {
            top: 250px;
            width: 100%;
            max-width: 1300px;
            z-index: 3;
            filter: drop-shadow(0 15px 30px rgba(0, 0, 0, 0.5));
        }

        /* 3. Princesa Ixk'uk sentada sobre el mecha */
        #layer-princess-hero {
            top: 140px;
            width: 820px;
            max-width: 90%;
            z-index: 5;
            filter: drop-shadow(0 25px 40px rgba(0, 0, 0, 0.75));
        }

        /* 4. Paredes rocosas de entrada al cañón (watchtowers) */
        #layer-canyon-rim {
            top: 380px;
            width: 100%;
            max-width: 1340px;
            z-index: 4;
            opacity: 0.98;
        }

        /* 5. FONDO COMPLETO DEL CAÑÓN Y LA CASCADA (Se extiende a lo largo de toda la página) */
        #layer-canyon-stream {
            top: 760px;
            width: 100%;
            max-width: 1240px;
            z-index: 1; /* Fondo continuo que evita cualquier espacio vacío */
            filter: drop-shadow(0 0 50px rgba(0, 0, 0, 0.8));
        }

        /* 6. Cascada en cañón entre rocas (Capa superior de agua) */
        #layer-waterfall-drop {
            top: 1020px;
            width: 580px;
            z-index: 3;
            mix-blend-mode: screen;
            filter: drop-shadow(0 0 30px rgba(0, 242, 254, 0.45));
        }

        /* 7. Cavernas y lagunas intermedias del segundo plano */
        #layer-midground-caverns {
            top: 2320px;
            width: 100%;
            max-width: 1220px;
            z-index: 4;
            filter: drop-shadow(0 20px 40px rgba(0, 0, 0, 0.7));
        }

        /* 8. Primer plano frontal con estatua gigante y río inferior */
        #layer-foreground-rocks {
            top: 3180px;
            width: 100%;
            max-width: 1280px;
            z-index: 8;
            filter: drop-shadow(0 30px 60px rgba(0, 0, 0, 0.95));
        }

        /* ==========================================================
           6. TARJETAS HUD FLOTANTES (ORGANIZACIÓN CRONOLÓGICA DIAPO 1, 2, 3, 4)
           ========================================================== */
        .hud-card {
            position: absolute;
            background: var(--cyan-glass);
            border: 1.5px solid var(--cyan-glow);
            border-radius: 22px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.75), 0 0 35px rgba(0, 242, 254, 0.25), inset 0 0 20px rgba(0, 242, 254, 0.08);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            overflow: hidden;
            pointer-events: auto;
            cursor: pointer;
            z-index: 7;
            transition: transform 0.35s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.35s ease, border-color 0.35s ease;
        }

        .hud-card:hover {
            transform: translateY(-8px) scale(1.02);
            border-color: var(--cyan-neon);
            box-shadow: 0 30px 65px rgba(0, 0, 0, 0.85), 0 0 50px rgba(0, 242, 254, 0.5);
        }

        .hud-card img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 18px;
        }

        /* 1. SECCIÓN SUPERIOR: DIAPOSITIVA 1 (Turnaround, swatches y UK) */
        #card-diapo-1 {
            top: 1140px;
            right: 2%;
            width: 480px;
            padding: 12px;
        }

        /* Miniatura de pose dinámica (Lado izquierdo) */
        #card-pose-thumbnail {
            top: 1100px;
            left: 3%;
            width: 190px;
            padding: 8px;
            border-radius: 16px;
        }

        /* 2. SECCIÓN MEDIA: DIAPOSITIVA 2 (Expresiones faciales y bocetos) */
        #card-diapo-2 {
            top: 1920px;
            left: 2%;
            width: 490px;
            padding: 12px;
        }

        /* 3. SECCIÓN MEDIA: DIAPOSITIVA 3 (Medallón rojo del Quetzal y Lore) */
        #card-diapo-3 {
            top: 2020px;
            right: 2%;
            width: 460px;
            padding: 12px;
        }

        /* 4. SECCIÓN LAGUNA 3D: Speeder en el agua y Paneles holográficos */
        #speeder-water-rush {
            position: absolute;
            top: 2900px;
            left: 50%;
            transform: translateX(-50%);
            width: 500px;
            z-index: 6;
            pointer-events: none;
            filter: drop-shadow(0 0 35px rgba(0, 242, 254, 0.65));
            animation: speederHover 4s ease-in-out infinite alternate;
        }

        @keyframes speederHover {
            0% { transform: translateX(-50%) translateY(0px) rotate(-1deg); }
            100% { transform: translateX(-50%) translateY(-12px) rotate(1deg); }
        }

        .holo-wireframe-cluster {
            position: absolute;
            top: 3120px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 22px;
            align-items: flex-end;
            z-index: 7;
            pointer-events: auto;
        }

        .holo-panel {
            position: relative;
            width: 165px;
            background: rgba(0, 242, 254, 0.08);
            border: 1.5px solid rgba(0, 242, 254, 0.7);
            border-radius: 14px;
            padding: 8px;
            backdrop-filter: blur(8px);
            box-shadow: 0 0 25px rgba(0, 242, 254, 0.3), inset 0 0 15px rgba(0, 242, 254, 0.15);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .holo-panel:hover {
            transform: translateY(-10px) scale(1.06);
            border-color: #ffffff;
            box-shadow: 0 0 40px var(--cyan-neon);
        }

        .holo-panel .holo-tag {
            font-family: var(--font-display);
            font-size: 0.75rem;
            font-weight: 800;
            color: var(--cyan-neon);
            letter-spacing: 2px;
            text-transform: uppercase;
            text-align: center;
            margin-bottom: 6px;
            text-shadow: 0 0 8px var(--cyan-neon);
        }

        .holo-panel img {
            width: 100%;
            height: auto;
            mix-blend-mode: screen;
            filter: brightness(1.2) drop-shadow(0 0 10px rgba(0, 242, 254, 0.5));
        }

        /* 5. SECCIÓN INFERIOR: DIAPOSITIVA 4 (Ficha técnica Princesa Ixk'uk) */
        #card-diapo-4 {
            top: 3920px;
            right: 2%;
            width: 500px;
            padding: 12px;
            z-index: 9;
        }

        /* Tarjeta naranja: Render de estudio del speeder */
        #card-speeder-orange {
            top: 4260px;
            left: 2%;
            width: 440px;
            background: linear-gradient(135deg, #f26829 0%, #c9440c 100%);
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 26px;
            padding: 14px;
            box-shadow: 0 20px 50px rgba(242, 104, 41, 0.5);
            z-index: 9;
        }

        /* Render 3D de la princesa en las ruinas */
        #render-nevera-ruins {
            position: absolute;
            top: 4300px;
            right: 12%;
            width: 280px;
            z-index: 9;
            pointer-events: auto;
            cursor: pointer;
            filter: drop-shadow(0 20px 45px rgba(0, 0, 0, 0.85));
            transition: transform 0.4s ease;
        }

        #render-nevera-ruins:hover {
            transform: scale(1.06) translateY(-5px);
        }

        /* ==========================================================
           7. MODAL LIGHTBOX
           ========================================================== */
        .lightbox-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(5, 12, 18, 0.94);
            backdrop-filter: blur(16px);
            z-index: 5000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .lightbox-modal.active {
            opacity: 1;
            pointer-events: auto;
        }

        .lightbox-container {
            position: relative;
            max-width: 90vw;
            max-height: 88vh;
            border: 2px solid var(--cyan-neon);
            border-radius: 20px;
            padding: 12px;
            background: rgba(10, 20, 30, 0.9);
            box-shadow: 0 0 50px rgba(0, 242, 254, 0.45);
            transform: scale(0.92);
            transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .lightbox-modal.active .lightbox-container {
            transform: scale(1);
        }

        .lightbox-img {
            max-width: 100%;
            max-height: 80vh;
            object-fit: contain;
            border-radius: 14px;
            display: block;
        }

        .lightbox-caption {
            margin-top: 10px;
            text-align: center;
            font-family: var(--font-display);
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--cyan-neon);
            letter-spacing: 1px;
        }

        .lightbox-close {
            position: absolute;
            top: -18px;
            right: -18px;
            width: 40px;
            height: 40px;
            background: var(--cyan-neon);
            color: #000;
            border: none;
            border-radius: 50%;
            font-size: 1.2rem;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 0 15px var(--cyan-neon);
            transition: transform 0.2s ease, background 0.2s ease;
        }

        .lightbox-close:hover {
            transform: scale(1.15) rotate(90deg);
            background: #ffffff;
        }

        /* Footer de navegación final */
        .site-footer {
            position: relative;
            z-index: 100;
            width: 100%;
            padding: 80px 20px 100px;
            text-align: center;
            background: linear-gradient(180deg, transparent 0%, #060a0e 100%);
        }

        .site-footer h2 {
            font-family: var(--font-display);
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: 1px;
            color: #ffffff;
            margin-bottom: 24px;
        }

        .footer-links {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .footer-links a {
            text-decoration: none;
            font-family: var(--font-display);
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--cyan-neon);
            border: 1.5px solid var(--cyan-neon);
            padding: 10px 24px;
            border-radius: 30px;
            transition: all 0.3s ease;
        }

        .footer-links a:hover {
            background: var(--cyan-neon);
            color: #000;
            box-shadow: 0 0 25px rgba(0, 242, 254, 0.5);
            transform: translateY(-2px);
        }

        /* Ajustes responsive para laptops y pantallas medianas */
        @media (max-width: 1200px) {
            .hud-card { width: 400px !important; }
            #card-diapo-1 { right: 1%; }
            #card-diapo-2 { left: 1%; }
            #card-diapo-3 { right: 1%; }
            #card-diapo-4 { right: 1%; }
            #card-speeder-orange { left: 1%; width: 380px; }
            .holo-panel { width: 135px; }
        }

        @media (max-width: 860px) {
            .main-nav { display: none; }
            .depth-meter { display: none; }
            .canyon-canvas { height: auto; display: flex; flex-direction: column; align-items: center; }
            .layer { position: relative !important; top: auto !important; left: auto !important; transform: none !important; width: 100% !important; }
            .hud-card { position: relative !important; width: 92% !important; margin: 30px auto !important; top: auto !important; left: auto !important; right: auto !important; }
            .holo-wireframe-cluster { position: relative !important; top: auto !important; left: auto !important; transform: none !important; margin: 40px auto !important; justify-content: center; }
        }
    </style>
</head>
<body>

    <!-- 1. HEADER ORGÁNICO SUPERIOR -->
    <header class="site-header">
        <div class="header-curve-bg"></div>
        <div class="header-content">
            <a href="index.html" class="brand-logo">
                <img src="images/LOGO-UNIDO.png" alt="Logo El Canto del Quetzal">
                <div class="brand-title">
                    <h1>El Canto</h1>
                    <span>Del Quetzal</span>
                </div>
            </a>

            <nav class="main-nav">
                <a href="#cumbre" onclick="scrollToY(0)">Cumbre Maya</a>
                <a href="#cascada" onclick="scrollToY(1150)">Cascada</a>
                <a href="#laguna" onclick="scrollToY(2900)">Laguna 3D</a>
                <a href="#santuario" onclick="scrollToY(3920)">Santuario</a>
                <a href="Ilustracion.html">Ilustración</a>
                <a href="bio.html">Bio</a>
                <a href="index.html" class="btn-back">&#8592; Menú Principal</a>
            </nav>
        </div>
    </header>

    <!-- 2. HUD LATERAL DE PROFUNDIDAD -->
    <aside class="depth-meter">
        <div class="depth-track">
            <div class="depth-fill" id="depthFill"></div>
        </div>
        <button class="depth-node active" onclick="scrollToY(0)">
            <span>01 // CUMBRE</span>
            <div class="dot"></div>
        </button>
        <button class="depth-node" onclick="scrollToY(1150)">
            <span>02 // CASCADA</span>
            <div class="dot"></div>
        </button>
        <button class="depth-node" onclick="scrollToY(2900)">
            <span>03 // LAGUNA HUD</span>
            <div class="dot"></div>
        </button>
        <button class="depth-node" onclick="scrollToY(3920)">
            <span>04 // SANTUARIO</span>
            <div class="dot"></div>
        </button>
    </aside>

    <!-- 3. CONTENEDOR PRINCIPAL DE LA LANDING PAGE -->
    <main class="landing-container" id="landingContainer">
        <div class="canyon-canvas">

            <!-- ====================================================
                 A. CAPAS DEL PAISAJE (STACK POSITION: ABSOLUTE & Z-INDEX)
                 ==================================================== -->

            <!-- Capa 1: Montañas del fondo en la cumbre -->
            <div class="layer center-x" id="layer-mountains" data-parallax-speed="0.12">
                <img src="images/montañas-del-fondo.png" alt="Montañas lejanas">
            </div>

            <!-- Capa 2: Templos y mecha en la cumbre -->
            <div class="layer center-x" id="layer-temples" data-parallax-speed="0.06">
                <img src="images/edificios 3.png" alt="Templos Mayas">
            </div>

            <!-- Capa 3: Princesa Ixk'uk sentada sobre el mecha -->
            <div class="layer center-x" id="layer-princess-hero" data-parallax-speed="0.03">
                <img src="images/princesa dibujo quetzal sin fondo.png" alt="Princesa Ixk'uk y Quetzal">
            </div>

            <!-- Capa 4: Entrada y watchtowers del cañón -->
            <div class="layer center-x" id="layer-canyon-rim" data-parallax-speed="0.05">
                <img src="images/fondo2.png" alt="Paredes superiores del cañón">
            </div>

            <!-- Capa 5: Fondo continuo del cañón y la cascada (Recorre todo el descenso) -->
            <div class="layer center-x" id="layer-canyon-stream" data-parallax-speed="0.0">
                <img src="images/fondo3.png" alt="Cañón y Cascada">
            </div>

            <!-- Capa 6: Caída superior de la cascada -->
            <div class="layer center-x" id="layer-waterfall-drop" data-parallax-speed="-0.04">
                <img src="images/Cascada en cañón entre rocas.png" alt="Cascada entre rocas">
            </div>

            <!-- Capa 7: Cavernas y lagunas del segundo plano -->
            <div class="layer center-x" id="layer-midground-caverns" data-parallax-speed="-0.03">
                <img src="images/segundo_plano_cascada_transparente.png" alt="Cavernas intermedias">
            </div>

            <!-- Capa 8: Primer plano frontal con estatua y río -->

    <!-- ==========================================================
       5. MOTOR JAVASCRIPT DEL PARALLAX 3D (NATURAL SCROLL + TILT)
       ========================================================== -->
    <script>
        const parallaxLayers = document.querySelectorAll('[data-parallax-speed]');
        const depthFill = document.getElementById('depthFill');
        const depthNodes = document.querySelectorAll('.depth-node');
        const landingContainer = document.getElementById('landingContainer');

        let mouseX = 0;
        let mouseY = 0;
        let targetMouseX = 0;
        let targetMouseY = 0;

        // Escuchar el movimiento del mouse para el efecto 3D horizontal interactivo
        window.addEventListener('mousemove', (e) => {
            const halfW = window.innerWidth / 2;
            const halfH = window.innerHeight / 2;
            targetMouseX = (e.clientX - halfW) / halfW; // Rango -1 a 1
            targetMouseY = (e.clientY - halfH) / halfH;
        });

        // BUCLE DE ANIMACIÓN FLUIDO (60/120 FPS con requestAnimationFrame)
        function updateParallax() {
            mouseX += (targetMouseX - mouseX) * 0.08;
            mouseY += (targetMouseY - mouseY) * 0.08;

            const scrollY = window.pageYOffset || document.documentElement.scrollTop;
            const windowH = window.innerHeight;
            const totalScroll = landingContainer.scrollHeight - windowH;
            const progress = Math.min(Math.max(scrollY / (totalScroll || 1), 0), 1);

            // Actualizar la barra lateral de profundidad
            if (depthFill) {
                depthFill.style.height = `${progress * 100}%`;
            }

            // Actualizar los puntos del HUD lateral según el scroll
            const checkpoints = [0, 1150, 2900, 3920];
            depthNodes.forEach((node, i) => {
                const targetY = checkpoints[i];
                if (Math.abs(scrollY - targetY) < 650) {
                    node.classList.add('active');
                } else {
                    node.classList.remove('active');
                }
            });

            // PARALLAX FLUIDO Y CONTROLADO
            parallaxLayers.forEach(el => {
                const speed = parseFloat(el.getAttribute('data-parallax-speed')) || 0;
                if (speed === 0) return;

                const rect = el.getBoundingClientRect();
                // Solo calcular para elementos cercanos a la pantalla para máximo rendimiento
                if (rect.top < windowH + 300 && rect.bottom > -300) {
                    // Desplazamiento relativo al centro de la pantalla (garantiza que jamás se mueva fuera de su sitio)
                    const viewportCenterOffset = (windowH / 2) - rect.top;
                    const translateY = viewportCenterOffset * speed;
                    
                    // Efecto de inclinación 3D del ratón
                    const isCentered = el.classList.contains('center-x');
                    const xBase = isCentered ? '-50%' : '0px';
                    const mouseShiftX = (mouseX * speed * 45).toFixed(1);

                    el.style.transform = `translate3d(calc(${xBase} + ${mouseShiftX}px), ${translateY.toFixed(1)}px, 0)`;
                }
            });

            requestAnimationFrame(updateParallax);
        }

        // Iniciar loop de renderizado
        requestAnimationFrame(updateParallax);

        // NAVEGACIÓN SUAVE POR PUNTOS DE PROFUNDIDAD
        function scrollToY(y) {
            window.scrollTo({
                top: y,
                behavior: 'smooth'
            });
        }

        // FUNCIONALIDAD LIGHTBOX (AMPLIAR ILUSTRACIONES)
        const modal = document.getElementById('lightboxModal');
        const modalImg = document.getElementById('lightboxImg');
        const modalCaption = document.getElementById('lightboxCaption');

        function openLightbox(src, caption) {
            if (!modal || !modalImg) return;
            modalImg.src = src;
            modalCaption.textContent = caption || '';
            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox() {
            if (!modal) return;
            modal.classList.remove('active');
            document.body.style.overflow = '';
            setTimeout(() => {
                if (modalImg) modalImg.src = '';
            }, 300);
        }

        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && modal.classList.contains('active')) {
                closeLightbox();
            }
        });
    </script>
