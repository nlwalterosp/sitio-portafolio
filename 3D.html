<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Canto del Quetzal | Experiencia Parallax 3D</title>
    
    <!-- Tipografías oficiales del portafolio -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        /* ==========================================================
           1. VARIABLES Y CONFIGURACIÓN BASE
           ========================================================== */
        :root {
            --cyan-neon: #00f2fe;
            --cyan-glow: rgba(0, 242, 254, 0.45);
            --cyan-glass: rgba(10, 24, 36, 0.82);
            --sand-header: #ede6d3;
            --sand-text: #2c2923;
            --canyon-dark: #0d141c;
            --font-display: "Inter Tight", sans-serif;
            --font-body: "Inter", sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            background-color: var(--canyon-dark);
        }

        body {
            width: 100%;
            min-height: 100vh;
            background-color: var(--canyon-dark);
            color: #ffffff;
            font-family: var(--font-body);
            overflow-x: hidden;
            position: relative;
        }

        body.intro-locked {
            overflow: hidden;
        }

        /* Barra de scroll personalizada */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #090e14;
        }
        ::-webkit-scrollbar-thumb {
            background: #00f2fe55;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #00f2feaa;
        }

        /* ==========================================================
           0. TELÓN BLANCO INICIAL + DOT SCATTER QUE VIAJA ARRIBA A LA IZQUIERDA
           ========================================================== */
        #whiteCurtainOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #EFECEC;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            user-select: none;
            cursor: pointer;
            opacity: 1;
            /* El telón blanco se desvanece suavemente después de que el texto empieza a encogerse hacia la esquina */
            transition: opacity 1.15s cubic-bezier(0.22, 1, 0.36, 1) 0.55s;
        }

        #whiteCurtainOverlay.curtain-open {
            opacity: 0;
            pointer-events: none;
        }

        #scatterStage {
            position: relative;
            width: 100vw;
            height: 100vh;
            transform-origin: center center;
            /* Transición suave para achicarse y ubicarse arriba a la izquierda */
            transition:
                transform 0.95s cubic-bezier(0.22, 1, 0.36, 1),
                opacity 0.65s ease 0.5s;
            will-change: transform, opacity;
        }

        #scatterSvg {
            width: 100%;
            height: 100%;
            display: block;
        }

        .intro-click-hint {
            position: absolute;
            bottom: 48px;
            left: 50%;
            transform: translateX(-50%);
            font-family: var(--font-display);
            font-size: 0.78rem;
            font-weight: 800;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #2c2923;
            background: rgba(255, 255, 255, 0.65);
            border: 1px solid rgba(0, 0, 0, 0.15);
            padding: 10px 24px;
            border-radius: 30px;
            pointer-events: none;
            transition: opacity 0.35s ease, transform 0.35s ease;
        }

        #whiteCurtainOverlay.curtain-open .intro-click-hint {
            opacity: 0;
            transform: translateX(-50%) translateY(10px);
        }

        /* ==========================================================
           TRANSICIÓN LIGERA Y SUAVE DE LAS IMÁGENES AL ABRIR EL TELÓN
           ========================================================== */
        @keyframes softHeroReveal {
            0% {
                opacity: 0;
                transform: translateX(-50%) translateY(18px) scale(1.02);
                filter: brightness(1.6) blur(4px);
            }
            100% {
                opacity: 1;
                transform: translateX(-50%) translateY(0px) scale(1);
                filter: brightness(1) blur(0px);
            }
        }

        /* Cuando se abre el telón blanco, cada imagen del inicio hace un fade ligero escalonado */
        body.curtain-opening #layer-mountains img,
        body.curtain-opening #layer-canyon-rim img,
        body.curtain-opening #layer-temples img,
        body.curtain-opening #layer-canyon-stream img,
        body.curtain-opening #layer-mecha img,
        body.curtain-opening #layer-princess-hero img {
            animation: softImgFadeIn 1.3s cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        body.curtain-opening #layer-mountains img { animation-delay: 0.25s; }
        body.curtain-opening #layer-canyon-rim img { animation-delay: 0.38s; }
        body.curtain-opening #layer-temples img { animation-delay: 0.50s; }
        body.curtain-opening #layer-canyon-stream img { animation-delay: 0.60s; }
        body.curtain-opening #layer-mecha img { animation-delay: 0.72s; }
        body.curtain-opening #layer-princess-hero img { animation-delay: 0.85s; }

        @keyframes softImgFadeIn {
            0% {
                opacity: 0;
                transform: scale(1.035) translateY(12px);
                filter: brightness(1.5);
            }
            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
                filter: brightness(1);
            }
        }

        /* ==========================================================
           2. HEADER ORGÁNICO SUPERIOR (ESTILO REFERENCIA)
           ========================================================== */
        .site-header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            pointer-events: none;
            transition: transform 0.3s ease;
        }

        .header-curve-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 85px;
            background: var(--sand-header);
            border-bottom-left-radius: 45% 25px;
            border-bottom-right-radius: 45% 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
            z-index: 1;
            pointer-events: none;
        }

        .header-content {
            position: relative;
            z-index: 2;
            pointer-events: auto;
            max-width: 1500px;
            margin: 0 auto;
            padding: 14px 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 14px;
            text-decoration: none;
            color: var(--sand-text);
            cursor: pointer;
        }

        .brand-logo img {
            height: 42px;
            width: auto;
            object-fit: contain;
        }

        .brand-title {
            display: flex;
            flex-direction: column;
        }

        .brand-title h1 {
            font-family: var(--font-display);
            font-size: 1.35rem;
            font-weight: 900;
            letter-spacing: 0.5px;
            color: #1a4231;
            line-height: 1;
            text-transform: uppercase;
        }

        .brand-title span {
            font-family: var(--font-display);
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 2.5px;
            color: #2b7a59;
            text-transform: uppercase;
            margin-top: 2px;
        }

        .main-nav {
            display: flex;
            align-items: center;
            gap: 24px;
            pointer-events: auto;
        }

        .main-nav a {
            text-decoration: none;
            font-family: var(--font-display);
            font-size: 0.85rem;
            font-weight: 700;
            color: #444037;
            padding: 6px 14px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .main-nav a:hover {
            color: #0b2216;
            background: rgba(0, 0, 0, 0.08);
            transform: translateY(-1px);
        }

        .main-nav a.btn-back {
            background: #1a4231;
            color: #ffffff;
            padding: 8px 18px;
        }

        .main-nav a.btn-back:hover {
            background: #000000;
            color: var(--cyan-neon);
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.35);
        }

        /* ==========================================================
           3. HUD LATERAL DE PROFUNDIDAD
           ========================================================== */
        .depth-meter {
            position: fixed;
            right: 28px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 900;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 16px;
            pointer-events: auto;
        }

        .depth-track {
            position: relative;
            width: 2px;
            height: 240px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 2px;
            overflow: hidden;
            margin-right: 12px;
        }

        .depth-fill {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 0%;
            background: linear-gradient(180deg, var(--cyan-neon), #00a8ff);
            box-shadow: 0 0 12px var(--cyan-neon);
            transition: height 0.1s ease-out;
        }

        .depth-node {
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: var(--font-display);
            font-size: 0.68rem;
            font-weight: 700;
            letter-spacing: 1px;
            color: rgba(255, 255, 255, 0.4);
            cursor: pointer;
            transition: all 0.3s ease;
            background: transparent;
            border: none;
        }

        .depth-node .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transition: all 0.3s ease;
        }

        .depth-node:hover,
        .depth-node.active {
            color: var(--cyan-neon);
            text-shadow: 0 0 8px var(--cyan-neon);
        }

        .depth-node:hover .dot,
        .depth-node.active .dot {
            background: var(--cyan-neon);
            box-shadow: 0 0 10px var(--cyan-neon);
            transform: scale(1.6);
        }

        /* ==========================================================
           4. ESCENARIO VERTICAL FULL-WIDTH (SIN BORDES NI RECORTES)
           ========================================================== */
        .landing-stage {
            position: relative;
            width: 100%;
            min-height: 7800px;
            overflow-x: hidden;
            background: linear-gradient(180deg, #9bb8c6 0%, #15222e 700px, #0e1720 2800px, #0c1219 5000px, #080d12 100%);
        }

        .full-bleed-layer {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            width: 100vw;
            min-width: 100%;
            pointer-events: none;
            will-change: transform;
        }

        .full-bleed-layer img {
            width: 100%;
            height: auto;
            display: block;
            user-select: none;
        }

        .center-x {
            left: 50%;
            transform: translateX(-50%);
        }

        /* ==========================================================
           5. APILAMIENTO EXACTO DE CAPAS (ORDEN DIAGRAMA DEL USUARIO)
           ========================================================== */
        #layer-mountains {
            top: 0px;
            z-index: 1;
            opacity: 0.98;
        }

        #layer-canyon-rim {
            top: 100px;
            z-index: 2;
        }

        #layer-temples {
            top: clamp(100px, 8vw, 150px);
            z-index: 3;
            filter: drop-shadow(0 15px 30px rgba(0, 0, 0, 0.55));
        }

        #layer-mecha {
            position: absolute;
            top: calc(clamp(480px, 35vw, 620px) + 280px);
            left: calc(50% + clamp(-10px, 0vw, 15px));
            transform: translateX(-50%);
            width: clamp(700px, 50vw, 940px);
            max-width: 56vw;
            z-index: 5;
            pointer-events: none;
            will-change: transform;
            filter: drop-shadow(0 20px 40px rgba(0, 0, 0, 0.8));
        }

        #layer-mecha img {
            width: 100%;
            height: auto;
            display: block;
            user-select: none;
        }

        #layer-princess-hero {
            position: absolute;
            top: calc(clamp(160px, 12vw, 220px) + 2.5cm + 280px);
            left: calc(50% + clamp(15px, 1.8vw, 35px));
            transform: translateX(-50%);
            width: clamp(300px, 22vw, 420px);
            height: calc(clamp(300px, 22vw, 420px) * 1.016);
            overflow: hidden;
            z-index: 7;
            pointer-events: none;
            will-change: transform;
            filter: drop-shadow(0 20px 35px rgba(0, 0, 0, 0.85));
        }
        #layer-princess-hero img {
            width: 100%;
            height: auto;
            display: block;
        }

        #layer-canyon-stream {
            top: 920px;
            z-index: 4;
            opacity: 0.98;
            filter: drop-shadow(0 0 50px rgba(0, 0, 0, 0.85));
        }

        /* Segundo plano cascada a 3680px para tapar el hueco negro */
        #layer-midground-caverns {
            top: 3680px;
            z-index: 7;
            filter: drop-shadow(0 25px 45px rgba(0, 0, 0, 0.75));
        }

        #layer-foreground-rocks {
            top: 4400px;
            z-index: 8;
            filter: drop-shadow(0 35px 65px rgba(0, 0, 0, 0.95));
        }

        #layer-metal-part {
            position: absolute;
            top: 6950px;
            left: calc(50% + clamp(180px, 17vw, 290px));
            transform: translateX(-50%);
            width: clamp(520px, 45vw, 750px);
            z-index: 8;
            filter: drop-shadow(0 20px 45px rgba(0, 0, 0, 0.85));
            pointer-events: none;
            will-change: transform;
        }

        #layer-metal-part img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* ==========================================================
           6. TARJETAS HUD FLOTANTES (CON TRANSICIÓN SUAVE AL BAJAR)
           ========================================================== */
        .hud-card {
            position: absolute;
            background: var(--cyan-glass);
            border: 1.5px solid var(--cyan-glow);
            border-radius: 22px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.75), 0 0 35px rgba(0, 242, 254, 0.25), inset 0 0 20px rgba(0, 242, 254, 0.08);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            overflow: hidden;
            pointer-events: auto;
            cursor: pointer;
            z-index: 20;
            will-change: transform, opacity;
            transition: box-shadow 0.35s ease, border-color 0.35s ease, opacity 0.85s ease;
        }

        .hud-card:hover {
            border-color: var(--cyan-neon);
            box-shadow: 0 30px 65px rgba(0, 0, 0, 0.85), 0 0 50px rgba(0, 242, 254, 0.55);
        }

        .hud-card img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 18px;
            pointer-events: none;
        }

        /* Clase suave para las imágenes a medida que se hace scroll */
        .soft-scroll-fade {
            opacity: 0;
            transition: opacity 0.9s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .soft-scroll-fade.in-view {
            opacity: 1;
        }

        #card-kaya-calla {
            top: calc(clamp(640px, 46vw, 790px) + 6.5cm + 280px);
            left: calc(50% + clamp(200px, 18vw, 320px));
            transform: translateX(-50%);
            width: clamp(390px, 31vw, 560px);
            padding: 12px;
            border-radius: 20px;
            border: 1.5px solid var(--cyan-neon);
            box-shadow: 0 0 30px rgba(0, 242, 254, 0.35), inset 0 0 15px rgba(0, 242, 254, 0.1);
            z-index: 20;
        }

        #card-pose-thumbnail {
            top: calc(clamp(660px, 48vw, 820px) + 6.5cm + 280px);
            left: calc(50% - clamp(280px, 27vw, 480px));
            transform: translateX(-50%);
            width: clamp(165px, 13vw, 220px);
            padding: 10px;
            border-radius: 0;
            clip-path: polygon(26px 0%, 100% 0%, 100% 100%, 0% 100%, 0% 26px);
            border: 1.5px solid var(--cyan-neon);
            box-shadow: 0 0 25px rgba(0, 242, 254, 0.4), inset 0 0 15px rgba(0, 242, 254, 0.15);
            z-index: 20;
        }

        #card-diapo-1 {
            top: 2100px;
            left: calc(50% + clamp(260px, 24vw, 420px));
            transform: translateX(-50%);
            width: clamp(480px, 44vw, 700px);
            max-width: min(700px, calc(100vw - 40px));
            padding: 12px;
            border-radius: 20px;
            z-index: 20;
        }

        #card-diapo-2 {
            top: 3150px;
            left: calc(50% - clamp(260px, 24vw, 420px));
            transform: translateX(-50%);
            width: clamp(480px, 44vw, 700px);
            max-width: min(700px, calc(100vw - 40px));
            padding: 14px;
            border-radius: 22px;
            z-index: 20;
        }

        #card-diapo-3 {
            top: 4200px;
            left: calc(50% + clamp(260px, 24vw, 420px));
            transform: translateX(-50%);
            width: clamp(480px, 44vw, 700px);
            max-width: min(700px, calc(100vw - 40px));
            padding: 14px;
            border-radius: 22px;
            z-index: 20;
        }

        /* Princesa con motocicleta agrandada */
        #speeder-water-rush {
            position: absolute;
            top: 5080px;
            left: 50%;
            transform: translateX(-50%);
            width: clamp(450px, 38vw, 650px);
            max-width: 46vw;
            z-index: 15;
            pointer-events: none;
            filter: drop-shadow(0 20px 45px rgba(0, 0, 0, 0.85)) drop-shadow(0 0 35px rgba(0, 242, 254, 0.7));
        }

        #speeder-water-rush img {
            width: 100%;
            height: auto;
            display: block;
            animation: speederHover 4s ease-in-out infinite alternate;
        }

        @keyframes speederHover {
            0% { transform: translateY(0px) rotate(-1deg); }
            100% { transform: translateY(-16px) rotate(1.5deg); }
        }

        /* ==========================================================
           DEPTH GALLERY (ORIGINKIT / CODROPS) EN VANILLA JS
           ========================================================== */
        .holo-wireframe-cluster {
            position: absolute;
            top: 5560px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            z-index: 25;
            pointer-events: auto;
            will-change: transform, opacity;
            width: clamp(340px, 68vw, 920px);
        }

        .holo-cluster-nav {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
            z-index: 5;
        }

        .holo-tab {
            background: rgba(10, 24, 36, 0.85);
            border: 1px solid rgba(0, 242, 254, 0.4);
            color: rgba(255, 255, 255, 0.75);
            font-family: var(--font-display);
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 1px;
            padding: 8px 18px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .holo-tab:hover,
        .holo-tab.active {
            color: #000;
            background: var(--cyan-neon);
            border-color: var(--cyan-neon);
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.5);
        }

        .depth-gallery-stage {
            position: relative;
            width: 100%;
            height: 540px;
            border-radius: 24px;
            overflow: hidden;
            border: 1.5px solid var(--cyan-glow);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.85), 0 0 40px rgba(0, 242, 254, 0.22);
            cursor: grab;
            user-select: none;
            touch-action: pan-x;
            background: #08131d;
        }

        .depth-gallery-stage:active {
            cursor: grabbing;
        }

        .dg-ground {
            position: absolute;
            inset: 0;
            pointer-events: none;
            transition: background 0.1s linear;
        }

        .dg-grain {
            position: absolute;
            inset: 0;
            background-size: 128px 128px;
            opacity: 0.1;
            mix-blend-mode: overlay;
            pointer-events: none;
        }

        .dg-corridor {
            position: absolute;
            inset: 0;
            perspective-origin: 50% 50%;
            transform-style: preserve-3d;
            pointer-events: none;
        }

        .dg-plate {
            position: absolute;
            left: 50%;
            top: 50%;
            overflow: hidden;
            backface-visibility: hidden;
            visibility: hidden;
            opacity: 0;
            will-change: transform, opacity;
            border: 1.5px solid rgba(0, 242, 254, 0.65);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.75), 0 0 30px rgba(0, 242, 254, 0.25);
            background: rgba(8, 22, 34, 0.85);
            backdrop-filter: blur(8px);
        }

        .dg-plate img {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: contain;
            padding: 18px;
            pointer-events: none;
            filter: drop-shadow(0 0 14px rgba(0, 242, 254, 0.45));
        }

        .dg-plate-tag {
            position: absolute;
            top: 12px;
            left: 14px;
            right: 14px;
            display: flex;
            justify-content: space-between;
            font-family: var(--font-display);
            font-size: 0.72rem;
            font-weight: 800;
            letter-spacing: 2px;
            color: var(--cyan-neon);
            text-transform: uppercase;
            text-shadow: 0 0 8px rgba(0, 242, 254, 0.8);
            pointer-events: none;
        }

        .dg-hud-controls {
            position: absolute;
            bottom: 14px;
            left: 18px;
            right: 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
            pointer-events: none;
        }

        .dg-hint {
            font-family: var(--font-display);
            font-size: 0.68rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            color: rgba(255, 255, 255, 0.65);
            background: rgba(6, 16, 24, 0.75);
            padding: 6px 12px;
            border-radius: 12px;
            border: 1px solid rgba(0, 242, 254, 0.25);
        }

        .dg-btn-group {
            display: flex;
            gap: 8px;
            pointer-events: auto;
        }

        .dg-btn {
            background: rgba(10, 24, 36, 0.9);
            border: 1px solid var(--cyan-neon);
            color: var(--cyan-neon);
            font-family: var(--font-display);
            font-size: 0.72rem;
            font-weight: 800;
            padding: 6px 13px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .dg-btn:hover {
            background: var(--cyan-neon);
            color: #000;
            box-shadow: 0 0 12px var(--cyan-neon);
        }

        #card-diapo-4 {
            top: 6450px;
            left: 50%;
            transform: translateX(-50%);
            width: clamp(520px, 48vw, 760px);
            padding: 14px;
            border-radius: 22px;
            z-index: 20;
        }

        #card-speeder-orange {
            top: 7100px;

                t: glyph([mark(19,0,9,9),mark(19,13,9,9),mark(0,27,57,9),mark(19,41,9,9),mark(19,54,9,9),mark(19,67,9,9),mark(19,81,9,9),mark(19,95,28,9),mark(57,95,9,9)]),
                u: glyph([mark(0,27,10,10),mark(48,27,9,9),mark(0,40,10,10),mark(48,41,9,9),mark(0,54,10,9),mark(48,54,9,9),mark(48,67,9,10),mark(0,68,10,9),mark(0,81,10,10),mark(38,81,19,10),mark(10,95,28,9),mark(48,95,9,9)]),
                v: glyph([mark(0,27,9,9),mark(48,27,9,9),mark(0,41,9,9),mark(48,41,9,9),mark(0,54,9,9),mark(48,54,9,9),mark(0,67,9,9),mark(48,67,9,9),mark(10,81,9,9),mark(38,81,9,9),mark(19,95,19,9)]),
                w: glyph([mark(0,27,9,9),mark(76,27,9,9),mark(0,41,9,9),mark(76,41,9,9),mark(0,54,9,9),mark(38,54,9,9),mark(76,54,9,9),mark(0,67,9,9),mark(19,67,9,9),mark(57,67,9,9),mark(76,67,9,9),mark(10,81,28,9),mark(48,81,28,9),mark(19,95,9,9),mark(57,95,9,9)]),
                x: glyph([mark(0,27,9,9),mark(57,27,9,9),mark(10,41,9,9),mark(47,41,9,9),mark(19,54,28,9),mark(10,67,9,9),mark(47,67,9,9),mark(0,81,9,9),mark(57,81,9,9),mark(0,95,9,9),mark(57,95,9,9)]),
                y: glyph([mark(0,27,10,10),mark(48,27,10,10),mark(0,40,10,10),mark(48,40,9,10),mark(0,54,10,10),mark(48,54,10,10),mark(0,67,10,10),mark(48,67,10,10),mark(10,81,9,10),mark(38,81,10,10),mark(19,95,19,9),mark(19,108,10,10),mark(0,122,19,9)]),
                z: glyph([mark(10,27,28,9),mark(38,41,9,9),mark(29,54,19,9),mark(10,67,19,9),mark(0,81,9,9),mark(10,95,28,9)])
            };
            const FALLBACK_GLYPH = glyph([mark(10,27,28),mark(38,41),mark(29,54,19),mark(19,81)]);

            const mulberry32 = (seed) => {
                let state = seed >>> 0;
                return () => {
                    state = (state + 0x6d2b79f5) >>> 0;
                    let t = state;
                    t = Math.imul(t ^ (t >>> 15), t | 1);
                    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
                    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
                };
            };

            function generateTextTargets(word, width, height) {
                const characters = [...word.toLowerCase()];
                const glyphs = characters.map(ch => GLYPHS[ch] || FALLBACK_GLYPH);
                const containerScale = Math.min(width / REFERENCE_WIDTH, height / REFERENCE_HEIGHT);
                const rawDotSize = REFERENCE_DOT_SIZE * containerScale;
                const totalColumns = glyphs.reduce((sum, g, idx) => sum + g.width / PAPER_CELL_SIZE + (idx === glyphs.length - 1 ? 0 : PRESET.letterGap), 0);
                const totalRows = PAPER_GLYPH_HEIGHT / PAPER_CELL_SIZE;
                const maxTextWidth = width * PRESET.maxWidth;
                const maxTextHeight = height * 0.72;
                const cellSize = Math.min(rawDotSize * PRESET.cellScale, maxTextWidth / Math.max(1, totalColumns), maxTextHeight / totalRows);
                const fillRatio = Math.min(0.72, Math.max(0.28, PRESET.fillRatio));
                const dotSize = Math.min(rawDotSize, cellSize * fillRatio);

                const positionScale = cellSize / PAPER_CELL_SIZE;
                const markScale = dotSize / PAPER_DOT_SIZE;
                const rawTargets = [];
                let cursorColumn = 0;

                for (let li = 0; li < glyphs.length; li++) {
                    const g = glyphs[li];
                    for (const m of g.marks) {
                        rawTargets.push({
                            x: (cursorColumn * cellSize) + (m.x + m.width / 2) * positionScale,
                            y: (m.y + m.height / 2) * positionScale,
                            w: m.width * markScale,
                            s: m.height * markScale,
                            letterIndex: li
                        });
                    }
                    cursorColumn += g.width / PAPER_CELL_SIZE + PRESET.letterGap;
                }

                let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
                for (const t of rawTargets) {
                    minX = Math.min(minX, t.x - t.w / 2);
                    maxX = Math.max(maxX, t.x + t.w / 2);
                    minY = Math.min(minY, t.y - t.s / 2);
                    maxY = Math.max(maxY, t.y + t.s / 2);
                }
                const textCx = (minX + maxX) / 2;
                const textCy = (minY + maxY) / 2;

                return rawTargets.map(t => ({
                    x: t.x - textCx + width / 2,
                    y: t.y - textCy + height / 2,
                    w: t.w,
                    s: t.s,
                    letterIndex: t.letterIndex
                }));
            }

            function pickScatterDestination(target, bandCy, bandHeight, markW, markH, rng) {
                const u1 = Math.max(1e-6, rng());
                const u2 = rng();
                const gx = Math.sqrt(-2 * Math.log(u1)) * Math.cos(2 * Math.PI * u2);
                let gy = Math.sqrt(-2 * Math.log(u1)) * Math.sin(2 * Math.PI * u2);
                if (target.y <= bandCy) gy -= 0.35;
                else gy += 0.35;

                const spreadX = Math.max(10, markH * 4.8);
                const spreadY = Math.max(10, markH * 6.5);
                let dx = gx * spreadX;
                let dy = gy * spreadY;

                const maxRx = spreadX * 2.15;
                const maxRy = Math.min(bandHeight * 0.48, spreadY * 2.35);
                const nx = dx / maxRx;
                const ny = dy / maxRy;
                const r2 = nx * nx + ny * ny;
                if (r2 > 1) {
                    const s = 1 / Math.sqrt(r2);
                    dx *= s;
                    dy *= s;
                }
                return { x: target.x - markW / 2 + dx, y: target.y - markH / 2 + dy };
            }

            const overlay = document.getElementById('whiteCurtainOverlay');
            const stage = document.getElementById('scatterStage');
            const svg = document.getElementById('scatterSvg');

            let particles = [];
            let stageW = window.innerWidth || 1280;
            let stageH = window.innerHeight || 720;
            let curtainOpened = false;

            function buildScatterScene(withEntryAnimation = false) {
                stageW = Math.max(300, window.innerWidth);
                stageH = Math.max(300, window.innerHeight);
                svg.setAttribute('viewBox', `0 0 ${stageW} ${stageH}`);
                svg.setAttribute('width', stageW);
                svg.setAttribute('height', stageH);
                svg.innerHTML = '';

                const targets = generateTextTargets(PRESET.text, stageW, stageH);
                const bandHeight = Math.max(40, stageH * 0.2);

                particles = targets.map((t, index) => {
                    const isDot = t.w <= t.s * 1.15;
                    const w = isDot ? t.s : t.w;
                    const h = t.s;
                    const radius = t.s / 2;
                    const homeX = t.x - w / 2;
                    const homeY = t.y - h / 2;

                    // Para que al inicio se vea la animación de las letras armándose
                    const rng = mulberry32((index * 9973 + 12345) >>> 0);
                    const startX = withEntryAnimation ? homeX + (rng() - 0.5) * 280 : homeX;
                    const startY = withEntryAnimation ? homeY + (rng() - 0.5) * 220 : homeY;

                    const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
                    rect.setAttribute('fill', PRESET.color);
                    rect.setAttribute('width', w.toFixed(2));
                    rect.setAttribute('height', h.toFixed(2));
                    rect.setAttribute('rx', radius.toFixed(2));
                    rect.setAttribute('ry', radius.toFixed(2));
                    rect.setAttribute('x', startX.toFixed(2));
                    rect.setAttribute('y', startY.toFixed(2));
                    svg.appendChild(rect);

                    return {
                        el: rect,
                        target: t,
                        index,
                        w, h,
                        homeX, homeY,
                        x: startX, y: startY,
                        vx: 0, vy: 0,
                        anchorX: homeX, anchorY: homeY,
                        scattered: false,
                        bandHeight
                    };
                });
            }

            // Construye las letras con una animación inicial donde los puntos se juntan para formar el nombre
            buildScatterScene(true);

            window.addEventListener('resize', () => {
                if (!curtainOpened) buildScatterScene(false);
            });

            // Dispersión al mover el mouse sobre las letras
            overlay.addEventListener('pointermove', (e) => {
                if (curtainOpened) return;
                const px = e.clientX;
                const py = e.clientY;
                const r2 = PRESET.cursorRadius * PRESET.cursorRadius;
                const bandCy = stageH / 2;

                for (let i = 0; i < particles.length; i++) {
                    const p = particles[i];
                    const dx = p.target.x - px;
                    const dy = p.target.y - py;
                    const shouldScatter = (dx * dx + dy * dy) <= r2;

                    if (shouldScatter && !p.scattered) {
                        p.scattered = true;
                        const rng = mulberry32((Date.now() ^ (p.index * 10007)) >>> 0);
                        const dest = pickScatterDestination(p.target, bandCy, p.bandHeight, p.w, p.h, rng);
                        p.anchorX = dest.x;
                        p.anchorY = dest.y;
                        p.vx += (rng() - 0.5) * 6;
                        p.vy += (rng() - 0.5) * 6;
                    } else if (!shouldScatter && p.scattered) {
                        p.scattered = false;
                        p.anchorX = p.homeX;
                        p.anchorY = p.homeY;
                    }
                }
            });

            // Bucle de física usando atributos nativos x/y de SVG (100% compatible con todos los navegadores)
            let lastTime = performance.now();
            function tickScatter(now) {
                if (curtainOpened && overlay.style.display === 'none') return;
                requestAnimationFrame(tickScatter);

                const dt = Math.min((now - lastTime) / 1000, 0.034);
                lastTime = now;

                const stiffness = 135;
                const damping = 15;

                for (let i = 0; i < particles.length; i++) {
                    const p = particles[i];
                    if (p.scattered) {
                        p.vx += (Math.random() - 0.5) * 18 * dt;
                        p.vy += (Math.random() - 0.5) * 18 * dt;
                    }

                    const forceX = (p.anchorX - p.x) * stiffness;
                    const forceY = (p.anchorY - p.y) * stiffness;

                    p.vx = (p.vx + forceX * dt) * Math.exp(-damping * dt);
                    p.vy = (p.vy + forceY * dt) * Math.exp(-damping * dt);

                    p.x += p.vx * dt;
                    p.y += p.vy * dt;

                    p.el.setAttribute('x', p.x.toFixed(2));
                    p.el.setAttribute('y', p.y.toFixed(2));
                }
            }
            requestAnimationFrame(tickScatter);

            // Al hacer clic sobre las letras: se hacen pequeñas, van arriba a la izquierda y se abre el telón blanco
            overlay.addEventListener('click', () => {
                if (curtainOpened) return;
                curtainOpened = true;

                // 1. Regresar todas las partículas a su posición de letra limpia
                for (let i = 0; i < particles.length; i++) {
                    particles[i].scattered = false;
                    particles[i].anchorX = particles[i].homeX;
                    particles[i].anchorY = particles[i].homeY;
                }

                // 2. Calcular la posición del logo superior izquierdo para llevar las letras hacia allá
                const logoEl = document.getElementById('brandLogoTarget');
                let targetX = 160;
                let targetY = 42;
                if (logoEl) {
                    const rect = logoEl.getBoundingClientRect();
                    targetX = rect.left + rect.width / 2;
                    targetY = rect.top + rect.height / 2;
                }

                const dx = targetX - (window.innerWidth / 2);
                const dy = targetY - (window.innerHeight / 2);

                // Las letras se achican (scale 0.14) y viajan a la parte superior izquierda
                stage.style.transform = `translate3d(${dx.toFixed(1)}px, ${dy.toFixed(1)}px, 0) scale(0.14)`;
                stage.style.opacity = '0';

                // 3. Abrir el telón blanco (fade from white) y activar la transición suave de la princesa y capas
                overlay.classList.add('curtain-open');
                document.body.classList.remove('intro-locked');
                document.body.classList.add('curtain-opening');

                setTimeout(() => {
                    overlay.style.display = 'none';
                }, 1750);
            });
        })();

        /* ==========================================================
           B. TRANSICIÓN LIGERA DE TARJETAS AL HACER SCROLL
           ========================================================== */
        const scrollFadeObserver = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('in-view');
                }
            });
        }, { threshold: 0.08 });

        document.querySelectorAll('.soft-scroll-fade').forEach(el => {
            scrollFadeObserver.observe(el);
        });
