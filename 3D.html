<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Canto del Quetzal | Experiencia Parallax 3D</title>
    
    <!-- Tipografías oficiales del portafolio -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        /* ==========================================================
           1. VARIABLES Y CONFIGURACIÓN BASE
           ========================================================== */
        :root {
            --cyan-neon: #00f2fe;
            --cyan-glow: rgba(0, 242, 254, 0.45);
            --cyan-glass: rgba(10, 24, 36, 0.82);
            --sand-header: #ede6d3;
            --sand-text: #2c2923;
            --canyon-dark: #0d141c;
            --font-display: "Inter Tight", sans-serif;
            --font-body: "Inter", sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            background-color: var(--canyon-dark);
        }

        body {
            width: 100%;
            min-height: 100vh;
            background-color: var(--canyon-dark);
            color: #ffffff;
            font-family: var(--font-body);
            overflow-x: hidden;
            position: relative;
        }

        body.intro-locked {
            overflow: hidden;
        }

        /* Barra de scroll personalizada */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #090e14;
        }
        ::-webkit-scrollbar-thumb {
            background: #00f2fe55;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #00f2feaa;
        }

        /* ==========================================================
           0. TELÓN BLANCO INICIAL + DOT SCATTER QUE VIAJA ARRIBA A LA IZQUIERDA
           ========================================================== */
        #whiteCurtainOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #EFECEC;
            z-index: 99999;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            user-select: none;
            cursor: pointer;
            opacity: 1;
            /* Fade from white (telón blanco suave) después de que las letras viajan a la esquina */
            transition: opacity 1.15s cubic-bezier(0.22, 1, 0.36, 1) 0.55s;
        }

        #whiteCurtainOverlay.curtain-open {
            opacity: 0;
            pointer-events: none;
        }

        #scatterStage {
            position: relative;
            width: 100vw;
            height: 100vh;
            transform-origin: center center;
            transition:
                transform 0.95s cubic-bezier(0.22, 1, 0.36, 1),
                opacity 0.65s ease 0.5s;
            will-change: transform, opacity;
        }

        #scatterCanvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .intro-click-hint {
            position: absolute;
            bottom: 48px;
            left: 50%;
            transform: translateX(-50%);
            font-family: var(--font-display);
            font-size: 0.78rem;
            font-weight: 800;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #2c2923;
            background: rgba(255, 255, 255, 0.85);
            border: 1.5px solid rgba(0, 0, 0, 0.2);
            padding: 12px 28px;
            border-radius: 30px;
            cursor: pointer;
            z-index: 10;
            transition: all 0.3s ease;
        }

        .intro-click-hint:hover {
            background: #000000;
            color: #ffffff;
        }

        #whiteCurtainOverlay.curtain-open .intro-click-hint {
            opacity: 0;
            transform: translateX(-50%) translateY(10px);
        }

        /* ==========================================================
           TRANSICIÓN LIGERA Y SUAVE DE LAS IMÁGENES AL ABRIR EL TELÓN
           ========================================================== */
        body.curtain-opening #layer-mountains img,
        body.curtain-opening #layer-canyon-rim img,
        body.curtain-opening #layer-temples img,
        body.curtain-opening #layer-canyon-stream img,
        body.curtain-opening #layer-mecha img,
        body.curtain-opening #layer-princess-hero img {
            animation: softImgFadeIn 1.3s cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        body.curtain-opening #layer-mountains img { animation-delay: 0.20s; }
        body.curtain-opening #layer-canyon-rim img { animation-delay: 0.34s; }
        body.curtain-opening #layer-temples img { animation-delay: 0.46s; }
        body.curtain-opening #layer-canyon-stream img { animation-delay: 0.58s; }
        body.curtain-opening #layer-mecha img { animation-delay: 0.70s; }
        body.curtain-opening #layer-princess-hero img { animation-delay: 0.82s; }

        @keyframes softImgFadeIn {
            0% {
                opacity: 0;
                transform: scale(1.04) translateY(14px);
                filter: brightness(1.5);
            }
            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
                filter: brightness(1);
            }
        }

        /* ==========================================================
           2. HEADER ORGÁNICO SUPERIOR (ESTILO REFERENCIA)
           ========================================================== */
        .site-header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            pointer-events: none;
            transition: transform 0.3s ease;
        }

        .header-curve-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 85px;
            background: var(--sand-header);
            border-bottom-left-radius: 45% 25px;
            border-bottom-right-radius: 45% 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
            z-index: 1;
            pointer-events: none;
        }

        .header-content {
            position: relative;
            z-index: 2;
            pointer-events: auto;
            max-width: 1500px;
            margin: 0 auto;
            padding: 14px 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 14px;
            text-decoration: none;
            color: var(--sand-text);
            cursor: pointer;
        }

        .brand-logo img {
            height: 42px;
            width: auto;
            object-fit: contain;
        }

        .brand-title {
            display: flex;
            flex-direction: column;
        }

        .brand-title h1 {
            font-family: var(--font-display);
            font-size: 1.35rem;
            font-weight: 900;
            letter-spacing: 0.5px;
            color: #1a4231;
            line-height: 1;
            text-transform: uppercase;
        }

        .brand-title span {
            font-family: var(--font-display);
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 2.5px;
            color: #2b7a59;
            text-transform: uppercase;
            margin-top: 2px;
        }

        .main-nav {
            display: flex;
            align-items: center;
            gap: 24px;
            pointer-events: auto;
        }

        .main-nav a {
            text-decoration: none;
            font-family: var(--font-display);
            font-size: 0.85rem;
            font-weight: 700;
            color: #444037;
            padding: 6px 14px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .main-nav a:hover {
            color: #0b2216;
            background: rgba(0, 0, 0, 0.08);
            transform: translateY(-1px);
        }

        .main-nav a.btn-back {
            background: #1a4231;
            color: #ffffff;
            padding: 8px 18px;
        }

        .main-nav a.btn-back:hover {
            background: #000000;
            color: var(--cyan-neon);
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.35);
        }

        /* ==========================================================
           3. HUD LATERAL DE PROFUNDIDAD
           ========================================================== */
        .depth-meter {
            position: fixed;
            right: 28px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 900;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 16px;
            pointer-events: auto;
        }

        .depth-track {
            position: relative;
            width: 2px;
            height: 240px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 2px;
            overflow: hidden;
            margin-right: 12px;
        }

        .depth-fill {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 0%;
            background: linear-gradient(180deg, var(--cyan-neon), #00a8ff);
            box-shadow: 0 0 12px var(--cyan-neon);
            transition: height 0.1s ease-out;
        }

        .depth-node {
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: var(--font-display);
            font-size: 0.68rem;
            font-weight: 700;
            letter-spacing: 1px;
            color: rgba(255, 255, 255, 0.4);
            cursor: pointer;
            transition: all 0.3s ease;
            background: transparent;
            border: none;
        }

        .depth-node .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transition: all 0.3s ease;
        }

        .depth-node:hover,
        .depth-node.active {
            color: var(--cyan-neon);
            text-shadow: 0 0 8px var(--cyan-neon);
        }

        .depth-node:hover .dot,
        .depth-node.active .dot {
            background: var(--cyan-neon);
            box-shadow: 0 0 10px var(--cyan-neon);
            transform: scale(1.6);
        }

        /* ==========================================================
           4. ESCENARIO VERTICAL FULL-WIDTH (SIN BORDES NI RECORTES)
           ========================================================== */
        .landing-stage {
            position: relative;
            width: 100%;
            min-height: 7800px;
            overflow-x: hidden;
            background: linear-gradient(180deg, #9bb8c6 0%, #15222e 700px, #0e1720 2800px, #0c1219 5000px, #080d12 100%);
        }

        .full-bleed-layer {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            width: 100vw;
            min-width: 100%;
            pointer-events: none;
            will-change: transform;
        }

        .full-bleed-layer img {
            width: 100%;
            height: auto;
            display: block;
            user-select: none;
        }

        .center-x {
            left: 50%;
            transform: translateX(-50%);
        }

        /* ==========================================================
           5. APILAMIENTO EXACTO DE CAPAS (ORDEN DIAGRAMA DEL USUARIO)
           ========================================================== */
        #layer-mountains {
            top: 0px;
            z-index: 1;
            opacity: 0.98;
        }

        #layer-canyon-rim {
            top: 100px;
            z-index: 2;
        }

        #layer-temples {
            top: clamp(100px, 8vw, 150px);
            z-index: 3;
            filter: drop-shadow(0 15px 30px rgba(0, 0, 0, 0.55));
        }

        #layer-mecha {
            position: absolute;
            top: calc(clamp(480px, 35vw, 620px) + 280px);
            left: calc(50% + clamp(-10px, 0vw, 15px));
            transform: translateX(-50%);
            width: clamp(700px, 50vw, 940px);
            max-width: 56vw;
            z-index: 5;
            pointer-events: none;
            will-change: transform;
            filter: drop-shadow(0 20px 40px rgba(0, 0, 0, 0.8));
        }

        #layer-mecha img {
            width: 100%;
            height: auto;
            display: block;
            user-select: none;
        }

        #layer-princess-hero {
            position: absolute;
            top: calc(clamp(160px, 12vw, 220px) + 2.5cm + 280px);
            left: calc(50% + clamp(15px, 1.8vw, 35px));
            transform: translateX(-50%);
            width: clamp(300px, 22vw, 420px);
            height: calc(clamp(300px, 22vw, 420px) * 1.016);
            overflow: hidden;
            z-index: 7;
            pointer-events: none;
            will-change: transform;
            filter: drop-shadow(0 20px 35px rgba(0, 0, 0, 0.85));
        }
        #layer-princess-hero img {
            width: 100%;
            height: auto;
            display: block;
        }

        #layer-canyon-stream {
            top: 920px;
            z-index: 4;
            opacity: 0.98;
            filter: drop-shadow(0 0 50px rgba(0, 0, 0, 0.85));
        }

        /* Segundo plano cascada a 3680px para tapar el hueco negro */
        #layer-midground-caverns {
            top: 3680px;
            z-index: 7;
            filter: drop-shadow(0 25px 45px rgba(0, 0, 0, 0.75));
        }

        #layer-foreground-rocks {
            top: 4400px;
            z-index: 8;
            filter: drop-shadow(0 35px 65px rgba(0, 0, 0, 0.95));
        }

        #layer-metal-part {
            position: absolute;
            top: 6950px;
            left: calc(50% + clamp(180px, 17vw, 290px));
            transform: translateX(-50%);
            width: clamp(520px, 45vw, 750px);
            z-index: 8;
            filter: drop-shadow(0 20px 45px rgba(0, 0, 0, 0.85));
            pointer-events: none;
            will-change: transform;
        }

        #layer-metal-part img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* ==========================================================
           6. TARJETAS HUD FLOTANTES (CON TRANSICIÓN LIGERA AL BAJAR)
           ========================================================== */
        .hud-card {
            position: absolute;
            background: var(--cyan-glass);
            border: 1.5px solid var(--cyan-glow);
            border-radius: 22px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.75), 0 0 35px rgba(0, 242, 254, 0.25), inset 0 0 20px rgba(0, 242, 254, 0.08);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            overflow: hidden;
            pointer-events: auto;
            cursor: pointer;
            z-index: 20;
            will-change: transform, opacity;
            transition: box-shadow 0.35s ease, border-color 0.35s ease, opacity 0.85s ease;
        }

        .hud-card:hover {
            border-color: var(--cyan-neon);
            box-shadow: 0 30px 65px rgba(0, 0, 0, 0.85), 0 0 50px rgba(0, 242, 254, 0.55);
        }

        .hud-card img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 18px;
            pointer-events: none;
        }

        .soft-scroll-fade {
            opacity: 0;
            transition: opacity 0.9s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .soft-scroll-fade.in-view {
            opacity: 1;
        }

        #card-kaya-calla {
            top: calc(clamp(640px, 46vw, 790px) + 6.5cm + 280px);
            left: calc(50% + clamp(200px, 18vw, 320px));
            transform: translateX(-50%);
            width: clamp(390px, 31vw, 560px);
            padding: 12px;
            border-radius: 20px;
            border: 1.5px solid var(--cyan-neon);
            box-shadow: 0 0 30px rgba(0, 242, 254, 0.35), inset 0 0 15px rgba(0, 242, 254, 0.1);
            z-index: 20;
        }

        #card-pose-thumbnail {
            top: calc(clamp(660px, 48vw, 820px) + 6.5cm + 280px);
            left: calc(50% - clamp(280px, 27vw, 480px));
            transform: translateX(-50%);
            width: clamp(165px, 13vw, 220px);
            padding: 10px;
            border-radius: 0;
            clip-path: polygon(26px 0%, 100% 0%, 100% 100%, 0% 100%, 0% 26px);
            border: 1.5px solid var(--cyan-neon);
            box-shadow: 0 0 25px rgba(0, 242, 254, 0.4), inset 0 0 15px rgba(0, 242, 254, 0.15);
            z-index: 20;
        }

        #card-diapo-1 {
            top: 2100px;
            left: calc(50% + clamp(260px, 24vw, 420px));
            transform: translateX(-50%);
            width: clamp(480px, 44vw, 700px);
            max-width: min(700px, calc(100vw - 40px));
            padding: 12px;
            border-radius: 20px;
            z-index: 20;
        }

        #card-diapo-2 {
            top: 3150px;
            left: calc(50% - clamp(260px, 24vw, 420px));
            transform: translateX(-50%);
            width: clamp(480px, 44vw, 700px);
            max-width: min(700px, calc(100vw - 40px));
            padding: 14px;
            border-radius: 22px;
            z-index: 20;
        }

        #card-diapo-3 {
            top: 4200px;
            left: calc(50% + clamp(260px, 24vw, 420px));
            transform: translateX(-50%);
            width: clamp(480px, 44vw, 700px);
            max-width: min(700px, calc(100vw - 40px));
            padding: 14px;
            border-radius: 22px;
            z-index: 20;
        }

        /* Princesa con motocicleta agrandada */
        #speeder-water-rush {
            position: absolute;
            top: 5080px;
            left: 50%;
            transform: translateX(-50%);
            width: clamp(450px, 38vw, 650px);
            max-width: 46vw;
            z-index: 15;
            pointer-events: none;
            filter: drop-shadow(0 20px 45px rgba(0, 0, 0, 0.85)) drop-shadow(0 0 35px rgba(0, 242, 254, 0.7));
        }

        #speeder-water-rush img {
            width: 100%;
            height: auto;
            display: block;
            animation: speederHover 4s ease-in-out infinite alternate;
        }

        @keyframes speederHover {
            0% { transform: translateY(0px) rotate(-1deg); }
            100% { transform: translateY(-16px) rotate(1.5deg); }
        }

        /* ==========================================================
           DEPTH GALLERY (ORIGINKIT / CODROPS) EN VANILLA JS
           ========================================================== */
        .holo-wireframe-cluster {
            position: absolute;
            top: 5560px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            z-index: 25;
            pointer-events: auto;
            will-change: transform, opacity;
            width: clamp(340px, 68vw, 920px);
        }

        .holo-cluster-nav {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
            z-index: 5;
        }

        .holo-tab {
            background: rgba(10, 24, 36, 0.85);
            border: 1px solid rgba(0, 242, 254, 0.4);
            color: rgba(255, 255, 255, 0.75);
            font-family: var(--font-display);
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 1px;
            padding: 8px 18px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .holo-tab:hover,
        .holo-tab.active {
            color: #000;
            background: var(--cyan-neon);
            border-color: var(--cyan-neon);
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.5);
        }

        .depth-gallery-stage {
            position: relative;
            width: 100%;
            height: 540px;
            border-radius: 24px;
            overflow: hidden;
            border: 1.5px solid var(--cyan-glow);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.85), 0 0 40px rgba(0, 242, 254, 0.22);
            cursor: grab;
            user-select: none;
            touch-action: pan-x;
            background: #08131d;
        }

        .depth-gallery-stage:active {
            cursor: grabbing;
        }

        .dg-ground {
            position: absolute;
            inset: 0;
            pointer-events: none;
            transition: background 0.1s linear;
        }

        .dg-grain {
            position: absolute;
            inset: 0;
            background-size: 128px 128px;
            opacity: 0.1;
            mix-blend-mode: overlay;
            pointer-events: none;
        }

        .dg-corridor {
            position: absolute;
            inset: 0;
            perspective-origin: 50% 50%;
            transform-style: preserve-3d;
            pointer-events: none;
        }

        .dg-plate {
            position: absolute;
            left: 50%;
            top: 50%;
            overflow: hidden;
            backface-visibility: hidden;
            visibility: hidden;
            opacity: 0;
            will-change: transform, opacity;
            border: 1.5px solid rgba(0, 242, 254, 0.65);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.75), 0 0 30px rgba(0, 242, 254, 0.25);
            background: rgba(8, 22, 34, 0.85);
            backdrop-filter: blur(8px);
        }

        .dg-plate img {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: contain;
            padding: 18px;
            pointer-events: none;
            filter: drop-shadow(0 0 14px rgba(0, 242, 254, 0.45));
        }

        .dg-plate-tag {
            position: absolute;
            top: 12px;
            left: 14px;
            right: 14px;
            display: flex;
            justify-content: space-between;
            font-family: var(--font-display);
            font-size: 0.72rem;
            font-weight: 800;
            letter-spacing: 2px;
            color: var(--cyan-neon);
            text-transform: uppercase;
            text-shadow: 0 0 8px rgba(0, 242, 254, 0.8);
            pointer-events: none;
        }

        .dg-hud-controls {
            position: absolute;
            bottom: 14px;
            left: 18px;
            right: 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
            pointer-events: none;
        }

        .dg-hint {
            font-family: var(--font-display);
            font-size: 0.68rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            color: rgba(255, 255, 255, 0.65);
            background: rgba(6, 16, 24, 0.75);
            padding: 6px 12px;
            border-radius: 12px;
            border: 1px solid rgba(0, 242, 254, 0.25);
        }

        .dg-btn-group {
            display: flex;
            gap: 8px;
            pointer-events: auto;
        }

        .dg-btn {
            background: rgba(10, 24, 36, 0.9);
            border: 1px solid var(--cyan-neon);
            color: var(--cyan-neon);
            font-family: var(--font-display);
            font-size: 0.72rem;
            font-weight: 800;
            padding: 6px 13px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .dg-btn:hover {
            background: var(--cyan-neon);
            color: #000;
            box-shadow: 0 0 12px var(--cyan-neon);
        }

        #card-diapo-4 {
            top: 6450px;
            left: 50%;
            transform: translateX(-50%);
            width: clamp(520px, 48vw, 760px);
            padding: 14px;
            border-radius: 22px;
            z-index: 20;
        }

        #card-speeder-orange {
            top: 7100px;
            left: calc(50% - clamp(240px, 22vw, 340px));
            transform: translateX(-50%);
            width: clamp(400px, 34vw, 500px);
            background: linear-gradient(135deg, #f26829 0%, #c9440c 100%);
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 26px;
            padding: 14px;
            box-shadow: 0 20px 50px rgba(242, 104, 41, 0.5);
            z-index: 20;
        }

        #render-nevera-ruins {
            position: absolute;
            top: 7080px;

    <script>
        var quetzalCurtainOpened = false;
        var scatterParticles = [];

        // Función global directa conectada al onclick del HTML (nunca falla)
        function openQuetzalCurtain() {
            if (quetzalCurtainOpened) return;
            quetzalCurtainOpened = true;

            var overlay = document.getElementById('whiteCurtainOverlay');
            var stage = document.getElementById('scatterStage');
            var logoEl = document.getElementById('brandLogoTarget');

            // 1. Devolver todos los puntos a su letra exacta
            for (var i = 0; i < scatterParticles.length; i++) {
                scatterParticles[i].scattered = false;
                scatterParticles[i].anchorX = scatterParticles[i].homeX;
                scatterParticles[i].anchorY = scatterParticles[i].homeY;
            }

            // 2. Calcular la esquina superior izquierda (donde está el logo)
            var targetX = 160;
            var targetY = 42;
            if (logoEl) {
                var rect = logoEl.getBoundingClientRect();
                if (rect.width > 0) {
                    targetX = rect.left + rect.width / 2;
                    targetY = rect.top + rect.height / 2;
                }
            }

            var dx = targetX - (window.innerWidth / 2);
            var dy = targetY - (window.innerHeight / 2);

            // 3. Achicar las letras y enviarlas arriba a la izquierda
            if (stage) {
                stage.style.transform = 'translate3d(' + dx.toFixed(1) + 'px, ' + dy.toFixed(1) + 'px, 0) scale(0.14)';
                stage.style.opacity = '0';
            }

            // 4. Desvanecer el telón blanco (fade from white) y revelar suavemente a la princesa
            if (overlay) {
                overlay.classList.add('curtain-open');
            }
            document.body.classList.remove('intro-locked');
            document.body.classList.add('curtain-opening');

            setTimeout(function() {
                if (overlay) overlay.style.display = 'none';
            }, 1750);
        }

        // Inicializador del Canvas Dot Scatter ("el canto del Quetzal")
        (function initCanvasDotScatter() {
            var canvas = document.getElementById('scatterCanvas');
            var overlay = document.getElementById('whiteCurtainOverlay');
            if (!canvas || !overlay) return;
            var ctx = canvas.getContext('2d');

            var PAPER_CELL_SIZE = 13;
            var PAPER_DOT_SIZE = 9;
            var PAPER_GLYPH_HEIGHT = 132;
            var REFERENCE_WIDTH = 720;
            var REFERENCE_HEIGHT = 405;
            var REFERENCE_DOT_SIZE = 8.6;

            var PRESET = {
                text: "el canto del Quetzal",
                cursorRadius: 115,
                color: "#000000",
                letterGap: 1.25,
                cellScale: 1.65,
                fillRatio: 0.56,
                maxWidth: 0.94
            };

            function m(x, y, w, h) {
                return { x: x, y: y, width: w || PAPER_DOT_SIZE, height: h || PAPER_DOT_SIZE };
            }
            function g(marks) {
                var maxW = 0;
                for (var i = 0; i < marks.length; i++) {
                    var right = marks[i].x + marks[i].width;
                    if (right > maxW) maxW = right;
                }
                return { width: maxW, marks: marks };
            }

            var GLYPHS = {
                " ": { width: PAPER_CELL_SIZE * 2, marks: [] },
                a: g([m(10,27,28,9),m(0,41,10,9),m(38,41,10,9),m(29,54,18,9),m(38,67,9,10),m(10,68,19,9),m(0,81,10,10),m(38,81,9,10),m(9,95,29,9),m(47,95,10,9)]),
                c: g([m(10,27,28,9),m(0,41,9,9),m(38,41,9,9),m(0,54,9,9),m(0,68,9,9),m(0,81,9,10),m(38,81,9,10),m(10,95,27,9)]),
                d: g([m(48,0,9,9),m(48,13,9,10),m(48,27,9,10),m(10,27,28,9),m(38,41,19,9),m(0,41,10,9),m(48,54,9,10),m(0,54,10,10),m(48,68,9,9),m(0,68,10,9),m(38,81,19,10),m(0,81,10,10),m(48,95,9,9),m(10,95,28,9)]),
                e: g([m(9,27,38,9),m(0,41,9,9),m(47,41,10,9),m(0,54,56,9),m(0,68,9,9),m(0,81,9,10),m(47,81,10,10),m(10,95,37,9)]),
                l: g([m(0,0,10,9),m(1,13,9,10),m(0,27,10,10),m(1,41,9,9),m(0,54,10,9),m(0,67,10,10),m(0,81,10,10),m(10,95,10,9)]),
                n: g([m(0,27,9,9),m(19,27,28,9),m(0,41,9,9),m(47,41,9,9),m(0,54,9,9),m(47,54,9,9),m(0,67,9,9),m(47,67,9,9),m(0,81,9,9),m(47,81,9,9),m(0,95,9,9),m(47,95,9,9)]),
                o: g([m(10,27,38,9),m(0,41,10,9),m(48,41,10,9),m(0,54,10,9),m(48,54,10,10),m(1,67,9,10),m(48,67,10,10),m(0,81,10,10),m(48,81,10,10),m(10,95,38,9)]),
                q: g([m(48,27,9,10),m(10,27,28,9),m(38,41,19,9),m(0,41,10,9),m(48,54,9,10),m(0,54,10,10),m(48,68,9,9),m(0,68,10,9),m(38,81,19,10),m(0,81,10,10),m(48,95,9,9),m(10,95,28,9),m(48,108,9,9),m(48,122,9,9)]),
                t: g([m(19,0,9,9),m(19,13,9,9),m(0,27,57,9),m(19,41,9,9),m(19,54,9,9),m(19,67,9,9),m(19,81,9,9),m(19,95,28,9),m(57,95,9,9)]),
                u: g([m(0,27,10,10),m(48,27,9,9),m(0,40,10,10),m(48,41,9,9),m(0,54,10,9),m(48,54,9,9),m(48,67,9,10),m(0,68,10,9),m(0,81,10,10),m(38,81,19,10),m(10,95,28,9),m(48,95,9,9)]),
                z: g([m(10,27,28,9),m(38,41,9,9),m(29,54,19,9),m(10,67,19,9),m(0,81,9,9),m(10,95,28,9)])
            };
            var FALLBACK = g([m(10,27,28),m(38,41),m(29,54,19),m(19,81)]);

            function mulberry32(seed) {
                var state = seed >>> 0;
                return function() {
                    state = (state + 0x6d2b79f5) >>> 0;
                    var t = state;
                    t = Math.imul(t ^ (t >>> 15), t | 1);
                    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
                    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
                };
            }

            var stageW = window.innerWidth || 1280;
            var stageH = window.innerHeight || 720;

            function buildScene(animateEntry) {
                stageW = Math.max(320, window.innerWidth);
                stageH = Math.max(320, window.innerHeight);
                var dpr = window.devicePixelRatio || 1;
                canvas.width = stageW * dpr;
                canvas.height = stageH * dpr;
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

                var chars = PRESET.text.toLowerCase().split('');
                var glyphs = [];
                var totalCols = 0;
                for (var i = 0; i < chars.length; i++) {
                    var gl = GLYPHS[chars[i]] || FALLBACK;
                    glyphs.push(gl);
                    totalCols += (gl.width / PAPER_CELL_SIZE) + (i === chars.length - 1 ? 0 : PRESET.letterGap);
                }

                var containerScale = Math.min(stageW / REFERENCE_WIDTH, stageH / REFERENCE_HEIGHT);
                var rawDotSize = REFERENCE_DOT_SIZE * containerScale;
                var totalRows = PAPER_GLYPH_HEIGHT / PAPER_CELL_SIZE;
                var cellSize = Math.min(
                    rawDotSize * PRESET.cellScale,
                    (stageW * PRESET.maxWidth) / Math.max(1, totalCols),
                    (stageH * 0.72) / totalRows

                var dotSize = Math.min(rawDotSize, cellSize * PRESET.fillRatio);
                var posScale = cellSize / PAPER_CELL_SIZE;
                var markScale = dotSize / PAPER_DOT_SIZE;

                var rawTargets = [];
                var cursorCol = 0;
                for (var li = 0; li < glyphs.length; li++) {
                    var curG = glyphs[li];
                    for (var mi = 0; mi < curG.marks.length; mi++) {
                        var mk = curG.marks[mi];
                        rawTargets.push({
                            x: (cursorCol * cellSize) + (mk.x + mk.width / 2) * posScale,
                            y: (mk.y + mk.height / 2) * posScale,
                            w: mk.width * markScale,
                            s: mk.height * markScale
                        });
                    }
                    cursorCol += (curG.width / PAPER_CELL_SIZE) + PRESET.letterGap;
                }

                var minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
                for (var k = 0; k < rawTargets.length; k++) {
                    var rt = rawTargets[k];
                    if (rt.x - rt.w / 2 < minX) minX = rt.x - rt.w / 2;
                    if (rt.x + rt.w / 2 > maxX) maxX = rt.x + rt.w / 2;
                    if (rt.y - rt.s / 2 < minY) minY = rt.y - rt.s / 2;
                    if (rt.y + rt.s / 2 > maxY) maxY = rt.y + rt.s / 2;
                }
                var textCx = (minX + maxX) / 2;
                var textCy = (minY + maxY) / 2;
                var bandHeight = Math.max(40, stageH * 0.2);

                scatterParticles = [];
                for (var idx = 0; idx < rawTargets.length; idx++) {
                    var t = rawTargets[idx];
                    var cx = t.x - textCx + stageW / 2;
                    var cy = t.y - textCy + stageH / 2;
                    var isDot = t.w <= t.s * 1.15;
                    var w = isDot ? t.s : t.w;
                    var h = t.s;
                    var homeX = cx - w / 2;
                    var homeY = cy - h / 2;

                    var rng = mulberry32((idx * 9973 + 54321) >>> 0);
                    var sx = animateEntry ? homeX + (rng() - 0.5) * 360 : homeX;
                    var sy = animateEntry ? homeY + (rng() - 0.5) * 260 : homeY;

                    scatterParticles.push({
                        cx: cx, cy: cy,
                        w: w, h: h, r: h / 2,
                        homeX: homeX, homeY: homeY,
                        x: sx, y: sy,
                        vx: 0, vy: 0,
                        anchorX: homeX, anchorY: homeY,
                        scattered: false,
                        bandHeight: bandHeight,
                        index: idx
                    });
                }
            }

            buildScene(true);
            window.addEventListener('resize', function() {
                if (!quetzalCurtainOpened) buildScene(false);
            });

            overlay.addEventListener('pointermove', function(e) {
                if (quetzalCurtainOpened) return;
                var px = e.clientX;
                var py = e.clientY;
                var r2 = PRESET.cursorRadius * PRESET.cursorRadius;
                var bandCy = stageH / 2;

                for (var i = 0; i < scatterParticles.length; i++) {
                    var p = scatterParticles[i];
                    var dx = p.cx - px;
                    var dy = p.cy - py;
                    var hit = (dx * dx + dy * dy) <= r2;

                    if (hit && !p.scattered) {
                        p.scattered = true;
                        var rng = mulberry32((Date.now() ^ (p.index * 10007)) >>> 0);
                        var u1 = Math.max(1e-6, rng());
                        var u2 = rng();
                        var gx = Math.sqrt(-2 * Math.log(u1)) * Math.cos(2 * Math.PI * u2);
                        var gy = Math.sqrt(-2 * Math.log(u1)) * Math.sin(2 * Math.PI * u2);

                        var spreadX = Math.max(10, p.h * 4.8);
                        var spreadY = Math.max(10, p.h * 6.5);
                        p.anchorX = p.homeX + gx * spreadX;
                        p.anchorY = p.homeY + gy * spreadY;
                        p.vx += (rng() - 0.5) * 6;
                        p.vy += (rng() - 0.5) * 6;
                    } else if (!hit && p.scattered) {
                        p.scattered = false;
                        p.anchorX = p.homeX;
                        p.anchorY = p.homeY;
                    }
                }
            });

            function drawRoundedPill(x, y, w, h, r) {
                var radius = Math.min(r, w / 2, h / 2);
                ctx.beginPath();
                ctx.moveTo(x + radius, y);
                ctx.lineTo(x + w - radius, y);
                ctx.quadraticCurveTo(x + w, y, x + w, y + radius);
                ctx.lineTo(x + w, y + h - radius);
                ctx.quadraticCurveTo(x + w, y + h, x + w - radius, y + h);
                ctx.lineTo(x + radius, y + h);
                ctx.quadraticCurveTo(x, y + h, x, y + h - radius);
                ctx.lineTo(x, y + radius);
                ctx.quadraticCurveTo(x, y, x + radius, y);
                ctx.closePath();
                ctx.fill();
            }

            var lastTime = performance.now();
            function tickCanvas(now) {
                if (quetzalCurtainOpened && overlay.style.display === 'none') return;
                requestAnimationFrame(tickCanvas);

                var dt = Math.min((now - lastTime) / 1000, 0.034);
                lastTime = now;

                ctx.clearRect(0, 0, stageW, stageH);
                ctx.fillStyle = PRESET.color;

                var stiffness = 130;
                var damping = 14;

                for (var i = 0; i < scatterParticles.length; i++) {
                    var p = scatterParticles[i];
                    if (p.scattered) {
                        p.vx += (Math.random() - 0.5) * 18 * dt;
                        p.vy += (Math.random() - 0.5) * 18 * dt;
                    }

                    var fx = (p.anchorX - p.x) * stiffness;
                    var fy = (p.anchorY - p.y) * stiffness;

                    p.vx = (p.vx + fx * dt) * Math.exp(-damping * dt);
                    p.vy = (p.vy + fy * dt) * Math.exp(-damping * dt);

                    p.x += p.vx * dt;
                    p.y += p.vy * dt;

                    drawRoundedPill(p.x, p.y, p.w, p.h, p.r);
                }
            }
            requestAnimationFrame(tickCanvas);
        })();

        // Depth Gallery
        const DG_SETS = {

                { src: 'images/render amiga2w.png', tag: 'WIRE BACK', caption: 'Proyección Holográfica // Vista Posterior', tint: { r: 20, g: 185, b: 255 } },

        const PERSPECTIVE_RATIO = 3.2;
        const GAP_MIN = 0.26, GAP_RANGE = 0.9;
        const SPREAD_RANGE = 0.6;
        const WHEEL_SPAN = 650, WHEEL_MIN = 0.4, WHEEL_RANGE = 1.6;
        const DRAG_GAIN = 1.8;
        const VELOCITY_MAX = 0.03, VELOCITY_DAMPING = 0.12;

        let dgDrift = 0;
        let dgPointer = { x: 0, y: 0 };
        let dgPointerTarget = { x: 0, y: 0 };
        let dgCurrentFocusIndex = 0;

        function dgClamp(v, min, max) { return Math.min(max, Math.max(min, v)); }
        function dgWrap(v, span) { return ((v % span) + span) % span; }
        function dgMix(a, b, t) { return a + (b - a) * t; }

        (function initGrain() {

        function buildDepthGalleryPlates(list) {

            const gap = perspective * (GAP_MIN + (dgClamp(dgConfig.depth, 0, 10) / 10) * GAP_RANGE);
            const scaleK = (perspective + gap) / perspective;
            const plateWidth = Math.max(dgConfig.cardWidth, 1) * scaleK;
            const plateHeight = Math.max(dgConfig.cardHeight, 1) * scaleK;

            dgCorridor.style.perspective = `${perspective}px`;

        function tickDepthGallery(now) {

            const perspective = Math.max(dgConfig.cardWidth, 120) * PERSPECTIVE_RATIO;
            const gap = perspective * (GAP_MIN + (dgClamp(dgConfig.depth, 0, 10) / 10) * GAP_RANGE);
            const scaleK = (perspective + gap) / perspective;

            dgStage.addEventListener('wheel', (e) => {

            });

            const releaseDrag = (e) => {
                if (activePointer !== e.pointerId) return;
                activePointer = null;
                if (dgStage.hasPointerCapture(e.pointerId)) dgStage.releasePointerCapture(e.pointerId);
                if (dragDistance < 6 && !e.target.closest('.dg-btn')) {
                    zoomFocusedPlate();
                }
            };

            dgStage.addEventListener('pointerup', releaseDrag);
            dgStage.addEventListener('pointercancel', releaseDrag);
            dgStage.addEventListener('pointerleave', () => {
                dgPointerTarget.x = 0;
                dgPointerTarget.y = 0;
            });
        }

        function stepDepthGallery(dir) {
            dgTarget = Math.round(dgTarget + dir);
        }

        function zoomFocusedPlate() {
            const item = dgItems[dgCurrentFocusIndex];
            if (item) openLightbox(item.src, item.caption);
        }

        function switchHoloSet(setName) {
            const tabs = document.querySelectorAll('.holo-tab');
            tabs.forEach(t => t.classList.remove('active'));
            if (setName === 'renders') {
                tabs[0]?.classList.add('active');
                buildDepthGalleryPlates(DG_SETS.renders);
            } else if (setName === 'wireframes') {
                tabs[1]?.classList.add('active');
                buildDepthGalleryPlates(DG_SETS.wireframes);
            } else {
                tabs[2]?.classList.add('active');
                buildDepthGalleryPlates(DG_SETS.all);
            }
            dgTarget = 0;
            dgCurrent = 0;
            dgPrevious = 0;
        }

        buildDepthGalleryPlates(DG_SETS.renders);
        requestAnimationFrame(tickDepthGallery);

        // Lightbox y Hacky-Text
        const modal = document.getElementById('lightboxModal');
        const modalImg = document.getElementById('lightboxImg');
        const modalCaption = document.getElementById('lightboxCaption');

        function openLightbox(src, caption) {
            if (!modal || !modalImg) return;
            modalImg.src = src;
            modalCaption.textContent = caption || '';
            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox() {
            if (!modal) return;
            modal.classList.remove('active');
            document.body.style.overflow = '';
            setTimeout(() => {
                if (modalImg) modalImg.src = '';
            }, 300);
        }

        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && modal.classList.contains('active')) {
                closeLightbox();
            }
        });

        const kprGlyphs = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789//<>[]";
        function runKprHack(el) {
            const original = el.getAttribute('data-value') || el.textContent;
            let iter = 0;
            clearInterval(el._kprInterval);
            el._kprInterval = setInterval(() => {
                el.textContent = original.split('').map((c, i) => {
                    if (i < iter || c === ' ') return original[i];
                    return kprGlyphs[Math.floor(Math.random() * kprGlyphs.length)];
                }).join('');
                if (iter >= original.length) clearInterval(el._kprInterval);
                iter += 0.5;
            }, 25);
        }

        document.querySelectorAll('.kpr-hack').forEach(el => {
            el.addEventListener('mouseenter', () => runKprHack(el));
        });
    </script>
</body>
</html>
