<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Canto del Quetzal | Experiencia Parallax 3D</title>
    
    <!-- Tipografías oficiales del portafolio -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        /* ==========================================================
           1. VARIABLES Y CONFIGURACIÓN BASE
           ========================================================== */
        :root {
            --cyan-neon: #00f2fe;
            --cyan-glow: rgba(0, 242, 254, 0.45);
            --cyan-glass: rgba(10, 24, 36, 0.82);
            --sand-header: #ede6d3;
            --sand-text: #2c2923;
            --canyon-dark: #0d141c;
            --font-display: "Inter Tight", sans-serif;
            --font-body: "Inter", sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            /* Quitamos scroll-behavior: smooth de aquí porque bloqueaba el parallax y los clics */
            background-color: var(--canyon-dark);
        }

        body {
            width: 100%;
            min-height: 100vh;
            background-color: var(--canyon-dark);
            color: #ffffff;
            font-family: var(--font-body);
            overflow-x: hidden;
            position: relative;
        }

        /* Barra de scroll personalizada */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #090e14;
        }
        ::-webkit-scrollbar-thumb {
            background: #00f2fe55;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #00f2feaa;
        }

        /* ==========================================================
           2. HEADER ORGÁNICO SUPERIOR (ESTILO REFERENCIA)
           ========================================================== */
        .site-header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            pointer-events: none;
            transition: transform 0.3s ease;
        }

        .header-curve-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 85px;
            background: var(--sand-header);
            border-bottom-left-radius: 45% 25px;
            border-bottom-right-radius: 45% 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
            z-index: 1;
            pointer-events: none;
        }

        .header-content {
            position: relative;
            z-index: 2;
            pointer-events: auto;
            max-width: 1500px;
            margin: 0 auto;
            padding: 14px 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 14px;
            text-decoration: none;
            color: var(--sand-text);
            cursor: pointer;
        }

        .brand-logo img {
            height: 42px;
            width: auto;
            object-fit: contain;
        }

        .brand-title {
            display: flex;
            flex-direction: column;
        }

        .brand-title h1 {
            font-family: var(--font-display);
            font-size: 1.35rem;
            font-weight: 900;
            letter-spacing: 0.5px;
            color: #1a4231;
            line-height: 1;
            text-transform: uppercase;
        }

        .brand-title span {
            font-family: var(--font-display);
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 2.5px;
            color: #2b7a59;
            text-transform: uppercase;
            margin-top: 2px;
        }

        .main-nav {
            display: flex;
            align-items: center;
            gap: 24px;
            pointer-events: auto;
        }

        .main-nav a {
            text-decoration: none;
            font-family: var(--font-display);
            font-size: 0.85rem;
            font-weight: 700;
            color: #444037;
            padding: 6px 14px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .main-nav a:hover {
            color: #0b2216;
            background: rgba(0, 0, 0, 0.08);
            transform: translateY(-1px);
        }

        .main-nav a.btn-back {
            background: #1a4231;
            color: #ffffff;
            padding: 8px 18px;
        }

        .main-nav a.btn-back:hover {
            background: #000000;
            color: var(--cyan-neon);
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.35);
        }

        /* ==========================================================
           3. HUD LATERAL DE PROFUNDIDAD
           ========================================================== */
        .depth-meter {
            position: fixed;
            right: 28px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 900;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 16px;
            pointer-events: auto;
        }

        .depth-track {
            position: relative;
            width: 2px;
            height: 240px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 2px;
            overflow: hidden;
            margin-right: 12px;
        }

        .depth-fill {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 0%;
            background: linear-gradient(180deg, var(--cyan-neon), #00a8ff);
            box-shadow: 0 0 12px var(--cyan-neon);
            transition: height 0.1s ease-out;
        }

        .depth-node {
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: var(--font-display);
            font-size: 0.68rem;
            font-weight: 700;
            letter-spacing: 1px;
            color: rgba(255, 255, 255, 0.4);
            cursor: pointer;
            transition: all 0.3s ease;
            background: transparent;
            border: none;
        }

        .depth-node .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transition: all 0.3s ease;
        }

        .depth-node:hover,
        .depth-node.active {
            color: var(--cyan-neon);
            text-shadow: 0 0 8px var(--cyan-neon);
        }

        .depth-node:hover .dot,
        .depth-node.active .dot {
            background: var(--cyan-neon);
            box-shadow: 0 0 10px var(--cyan-neon);
            transform: scale(1.6);
        }

        /* ==========================================================
           4. ESCENARIO VERTICAL FULL-WIDTH (SIN BORDES NI RECORTES)
           ========================================================== */
        .landing-stage {
            position: relative;
            width: 100%;
            min-height: 7800px;
            overflow-x: hidden;
            background: linear-gradient(180deg, #9bb8c6 0%, #15222e 700px, #0e1720 2800px, #0c1219 5000px, #080d12 100%);
        }

        .full-bleed-layer {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            width: 100vw;
            min-width: 100%;
            pointer-events: none;
            will-change: transform;
        }

        .full-bleed-layer img {
            width: 100%;
            height: auto;
            display: block;
            user-select: none;
        }

        .center-x {
            left: 50%;
            transform: translateX(-50%);
        }

        /* ==========================================================
           5. APILAMIENTO EXACTO DE CAPAS (ORDEN DIAGRAMA DEL USUARIO)
           ========================================================== */
        #layer-mountains {
            top: 0px;
            z-index: 1;
            opacity: 0.98;
        }

        #layer-canyon-rim {
            top: 100px;
            z-index: 2;
        }

        #layer-temples {
            top: clamp(100px, 8vw, 150px);
            z-index: 3;
            filter: drop-shadow(0 15px 30px rgba(0, 0, 0, 0.55));
        }

        #layer-mecha {
            position: absolute;
            top: calc(clamp(480px, 35vw, 620px) + 280px);
            left: calc(50% + clamp(-10px, 0vw, 15px));
            transform: translateX(-50%);
            width: clamp(700px, 50vw, 940px);
            max-width: 56vw;
            z-index: 5;
            pointer-events: none;
            will-change: transform;
            filter: drop-shadow(0 20px 40px rgba(0, 0, 0, 0.8));
        }

        #layer-mecha img {
            width: 100%;
            height: auto;
            display: block;
            user-select: none;
        }

        #layer-princess-hero {
            position: absolute;
            top: calc(clamp(160px, 12vw, 220px) + 2.5cm + 280px);
            left: calc(50% + clamp(15px, 1.8vw, 35px));
            transform: translateX(-50%);
            width: clamp(300px, 22vw, 420px);
            height: calc(clamp(300px, 22vw, 420px) * 1.016);
            overflow: hidden;
            z-index: 7;
            pointer-events: none;
            will-change: transform;
            filter: drop-shadow(0 20px 35px rgba(0, 0, 0, 0.85));
        }
        #layer-princess-hero img {
            width: 100%;
            height: auto;
            display: block;
        }

        #layer-canyon-stream {
            top: 920px;
            z-index: 4;
            opacity: 0.98;
            filter: drop-shadow(0 0 50px rgba(0, 0, 0, 0.85));
        }

        #layer-midground-caverns {
            top: 3200px;
            z-index: 7;
            filter: drop-shadow(0 25px 45px rgba(0, 0, 0, 0.75));
        }

        #layer-foreground-rocks {
            top: 4400px;
            z-index: 8;
            filter: drop-shadow(0 35px 65px rgba(0, 0, 0, 0.95));
        }

        #layer-metal-part {
            position: absolute;
            top: 6950px;
            left: calc(50% + clamp(180px, 17vw, 290px));
            transform: translateX(-50%);
            width: clamp(520px, 45vw, 750px);
            z-index: 8;
            filter: drop-shadow(0 20px 45px rgba(0, 0, 0, 0.85));
            pointer-events: none;
            will-change: transform;
        }

        #layer-metal-part img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* ==========================================================
           6. TARJETAS HUD FLOTANTES (ORDEN CRONOLÓGICO DIAPO 1, 2, 3 Y 4)
           ========================================================== */
        .hud-card {
            position: absolute;
            background: var(--cyan-glass);
            border: 1.5px solid var(--cyan-glow);
            border-radius: 22px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.75), 0 0 35px rgba(0, 242, 254, 0.25), inset 0 0 20px rgba(0, 242, 254, 0.08);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            overflow: hidden;
            pointer-events: auto;
            cursor: pointer;
            z-index: 20;
            will-change: transform;
            transition: box-shadow 0.35s ease, border-color 0.35s ease;
        }

        .hud-card:hover {
            border-color: var(--cyan-neon);
            box-shadow: 0 30px 65px rgba(0, 0, 0, 0.85), 0 0 50px rgba(0, 242, 254, 0.55);
        }

        .hud-card img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 18px;
            pointer-events: none;
        }

        #card-kaya-calla {
            top: calc(clamp(640px, 46vw, 790px) + 6.5cm + 280px);
            left: calc(50% + clamp(200px, 18vw, 320px));
            transform: translateX(-50%);
            width: clamp(390px, 31vw, 560px);
            padding: 12px;
            border-radius: 20px;
            border: 1.5px solid var(--cyan-neon);
            box-shadow: 0 0 30px rgba(0, 242, 254, 0.35), inset 0 0 15px rgba(0, 242, 254, 0.1);
            z-index: 20;
        }

        #card-pose-thumbnail {
            top: calc(clamp(660px, 48vw, 820px) + 6.5cm + 280px);
            left: calc(50% - clamp(280px, 27vw, 480px));
            transform: translateX(-50%);
            width: clamp(165px, 13vw, 220px);
            padding: 10px;
            border-radius: 0;
            clip-path: polygon(26px 0%, 100% 0%, 100% 100%, 0% 100%, 0% 26px);
            border: 1.5px solid var(--cyan-neon);
            box-shadow: 0 0 25px rgba(0, 242, 254, 0.4), inset 0 0 15px rgba(0, 242, 254, 0.15);
            z-index: 20;
        }

        #card-diapo-1 {
            top: 2100px;
            left: calc(50% + clamp(260px, 24vw, 420px));
            transform: translateX(-50%);
            width: clamp(480px, 44vw, 700px);
            max-width: min(700px, calc(100vw - 40px));
            padding: 12px;
            border-radius: 20px;
            z-index: 20;
        }

        #card-diapo-2 {
            top: 3150px;
            left: calc(50% - clamp(260px, 24vw, 420px));
            transform: translateX(-50%);
            width: clamp(480px, 44vw, 700px);
            max-width: min(700px, calc(100vw - 40px));
            padding: 14px;
            border-radius: 22px;
            z-index: 20;
        }

        #card-diapo-3 {
            top: 4200px;
            left: calc(50% + clamp(260px, 24vw, 420px));
            transform: translateX(-50%);
            width: clamp(480px, 44vw, 700px);
            max-width: min(700px, calc(100vw - 40px));
            padding: 14px;
            border-radius: 22px;
            z-index: 20;
        }

        #speeder-water-rush {
            position: absolute;
            top: 5250px;
            left: 50%;
            transform: translateX(-50%);
            width: clamp(280px, 24vw, 380px);
            max-width: 25vw;
            z-index: 9;
            pointer-events: none;
            filter: drop-shadow(0 0 35px rgba(0, 242, 254, 0.7));
        }

        #speeder-water-rush img {
            width: 100%;
            height: auto;
            display: block;
            animation: speederHover 4s ease-in-out infinite alternate;
        }

        @keyframes speederHover {
            0% { transform: translateY(0px) rotate(-1deg); }
            100% { transform: translateY(-12px) rotate(1deg); }
        }

        .holo-wireframe-cluster {
            position: absolute;
            top: 5650px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            z-index: 20;
            pointer-events: auto;
            will-change: transform;
        }

        .holo-cluster-nav {
            display: flex;
            gap: 10px;
            margin-bottom: 2px;
        }

        .holo-tab {
            background: rgba(10, 24, 36, 0.85);
            border: 1px solid rgba(0, 242, 254, 0.4);
            color: rgba(255, 255, 255, 0.75);
            font-family: var(--font-display);
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 1px;
            padding: 6px 16px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .holo-tab:hover,
        .holo-tab.active {
            color: #000;
            background: var(--cyan-neon);
            border-color: var(--cyan-neon);
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.5);
        }

        .holo-panels-grid {
            display: none;
            gap: 14px;
            align-items: flex-end;
            justify-content: center;
        }

        .holo-panels-grid.active {
            display: flex;
        }

        .holo-panel {
            position: relative;
            width: 160px;
            max-width: 14vw;
            background: rgba(0, 242, 254, 0.08);
            border: 1.5px solid rgba(0, 242, 254, 0.7);
            border-radius: 16px;
            padding: 10px;
            backdrop-filter: blur(8px);
            box-shadow: 0 0 25px rgba(0, 242, 254, 0.3), inset 0 0 15px rgba(0, 242, 254, 0.15);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .holo-panel:hover {
            transform: translateY(-10px) scale(1.06);
            border-color: #ffffff;
            box-shadow: 0 0 40px var(--cyan-neon);
        }

        .holo-panel .holo-tag {
            font-family: var(--font-display);
            font-size: 0.75rem;
            font-weight: 800;
            color: var(--cyan-neon);
            letter-spacing: 2px;
            text-transform: uppercase;
            text-align: center;
            margin-bottom: 6px;
            text-shadow: 0 0 8px var(--cyan-neon);
            pointer-events: none;
        }

        .holo-panel img {
            width: 100%;
            height: auto;
            mix-blend-mode: screen;
            filter: contrast(1.15) brightness(1.1) drop-shadow(0 0 10px rgba(0, 242, 254, 0.5));
            border-radius: 8px;
            pointer-events: none;
        }

        #card-diapo-4 {
            top: 6450px;
            left: 50%;
            transform: translateX(-50%);
            width: clamp(520px, 48vw, 760px);
            padding: 14px;
            border-radius: 22px;
            z-index: 20;
        }

        #card-speeder-orange {
            top: 7100px;
            left: calc(50% - clamp(240px, 22vw, 340px));
            transform: translateX(-50%);
            width: clamp(400px, 34vw, 500px);
            background: linear-gradient(135deg, #f26829 0%, #c9440c 100%);
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 26px;
            padding: 14px;
            box-shadow: 0 20px 50px rgba(242, 104, 41, 0.5);
            z-index: 20;
        }

        #render-nevera-ruins {
            position: absolute;
            top: 7080px;
            left: calc(50% + clamp(150px, 14vw, 230px));
            transform: translateX(-50%);
            width: clamp(240px, 19vw, 320px);
            z-index: 22;
            pointer-events: auto;
            cursor: pointer;
            filter: drop-shadow(0 25px 50px rgba(0, 0, 0, 0.95));
            will-change: transform;
            transition: transform 0.4s ease;
        }

        #render-nevera-ruins:hover {
            transform: translateX(-50%) scale(1.06) translateY(-5px);
        }

        #render-nevera-ruins img {
            width: 100%;
            height: auto;
            display: block;
            pointer-events: none;
        }

        /* ==========================================================
           7. MODAL LIGHTBOX
           ========================================================== */
        .lightbox-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(5, 12, 18, 0.94);
            backdrop-filter: blur(16px);
            z-index: 5000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .lightbox-modal.active {
            opacity: 1;
            pointer-events: auto;
        }

        .lightbox-container {
            position: relative;
            max-width: 90vw;
            max-height: 88vh;
            border: 2px solid var(--cyan-neon);
            border-radius: 20px;
            padding: 12px;
            background: rgba(10, 20, 30, 0.9);
            box-shadow: 0 0 50px rgba(0, 242, 254, 0.45);
            transform: scale(0.92);
            transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .lightbox-modal.active .lightbox-container {
            transform: scale(1);
        }

        .lightbox-img {
            max-width: 100%;
            max-height: 80vh;
            object-fit: contain;
            border-radius: 14px;
            display: block;
        }

        .lightbox-caption {
            margin-top: 10px;
            text-align: center;
            font-family: var(--font-display);
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--cyan-neon);
            letter-spacing: 1px;
        }

        .lightbox-close {
            position: absolute;
            top: -18px;
            right: -18px;
            width: 40px;
            height: 40px;
            background: var(--cyan-neon);
            color: #000;
            border: none;
            border-radius: 50%;
            font-size: 1.2rem;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 0 15px var(--cyan-neon);
            transition: transform 0.2s ease, background 0.2s ease;
        }

        .lightbox-close:hover {
            transform: scale(1.15) rotate(90deg);
            background: #ffffff;
        }

        .site-footer {
            position: relative;
            z-index: 100;
            width: 100%;
            padding: 90px 20px 120px;
            text-align: center;
            background: linear-gradient(180deg, #0c1219 0%, #05080c 100%);
            border-top: 1.5px solid rgba(0, 242, 254, 0.25);
        }

        .site-footer h2 {
            font-family: var(--font-display);
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: 1px;
            color: #ffffff;
            margin-bottom: 24px;
        }

        .footer-links {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .footer-links a {
            text-decoration: none;
            font-family: var(--font-display);
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--cyan-neon);
            border: 1.5px solid var(--cyan-neon);
            padding: 10px 24px;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .footer-links a:hover {
            background: var(--cyan-neon);
            color: #000;
            box-shadow: 0 0 25px rgba(0, 242, 254, 0.5);
            transform: translateY(-2px);
        }

        @media (max-width: 860px) {
            .main-nav { display: none; }
            .depth-meter { display: none; }
            .hud-card { position: relative !important; width: 92% !important; margin: 30px auto !important; top: auto !important; left: auto !important; right: auto !important; transform: none !important; }
            #card-pose-thumbnail { clip-path: none !important; border-radius: 20px !important; width: 85% !important; }
            .holo-wireframe-cluster { position: relative !important; top: auto !important; left: auto !important; transform: none !important; margin: 40px auto !important; justify-content: center; }
            .holo-panels-grid { flex-wrap: wrap; }
            .holo-panel { width: 44% !important; max-width: none !important; }
            #layer-mecha { position: relative !important; width: 95% !important; margin: 20px auto !important; top: auto !important; left: auto !important; transform: none !important; }
            #layer-princess-hero { position: relative !important; width: 75% !important; height: auto !important; margin: -120px auto 30px !important; top: auto !important; left: auto !important; transform: none !important; }
            #layer-metal-part { position: relative !important; width: 92% !important; margin: 20px auto !important; top: auto !important; left: auto !important; transform: none !important; }
            #render-nevera-ruins { position: relative !important; width: 65% !important; margin: -110px auto 30px !important; top: auto !important; left: auto !important; transform: none !important; }
        }
    </style>
</head>
<body>

    <!-- 1. HEADER ORGÁNICO SUPERIOR -->
    <header class="site-header">
        <div class="header-curve-bg"></div>
        <div class="header-content">
            <a href="index.html" class="brand-logo">
                <img src="images/LOGO-UNIDO.png" alt="Logo El Canto del Quetzal">
                <div class="brand-title">
                    <h1 class="kpr-hack" data-value="El Canto">El Canto</h1>
                    <span class="kpr-hack" data-value="Del Quetzal">Del Quetzal</span>
                </div>
            </a>

            <!-- Usamos return false para que el href="#..." NO cancele el clic del scroll -->
            <nav class="main-nav">

    <!-- ==========================================================
       5. MOTOR JAVASCRIPT DEL PARALLAX 3D (ORIGINAL)
       ========================================================== -->
    <script>
        const layerMountains = document.getElementById('layer-mountains');
        const layerRim = document.getElementById('layer-canyon-rim');
        const layerTemples = document.getElementById('layer-temples');
        const layerMecha = document.getElementById('layer-mecha');
        const layerPrincess = document.getElementById('layer-princess-hero');
        const layerCanyonStream = document.getElementById('layer-canyon-stream');
        const layerMidgroundCaverns = document.getElementById('layer-midground-caverns');
        const layerForegroundRocks = document.getElementById('layer-foreground-rocks');
        const layerMetalPart = document.getElementById('layer-metal-part');

        const floatCards = document.querySelectorAll('[data-float-speed]');
        const depthFill = document.getElementById('depthFill');
        const depthNodes = document.querySelectorAll('.depth-node');
        const landingStage = document.getElementById('landingStage');

        let mouseX = 0;
        let mouseY = 0;
        let targetMouseX = 0;
        let targetMouseY = 0;

        window.addEventListener('mousemove', (e) => {
            const halfW = window.innerWidth / 2;
            const halfH = window.innerHeight / 2;
            targetMouseX = (e.clientX - halfW) / halfW;
            targetMouseY = (e.clientY - halfH) / halfH;
        });

        function updateParallax() {
            mouseX += (targetMouseX - mouseX) * 0.08;
            mouseY += (targetMouseY - mouseY) * 0.08;

            const scrollY = window.pageYOffset || document.documentElement.scrollTop;
            const windowH = window.innerHeight;
            const totalScroll = landingStage.scrollHeight - windowH;
            const progress = Math.min(Math.max(scrollY / (totalScroll || 1), 0), 1);

            if (depthFill) {
                depthFill.style.height = `${progress * 100}%`;
            }

            const checkpoints = [0, 2100, 5250, 6450];
            depthNodes.forEach((node, i) => {
                const targetY = checkpoints[i];
                if (Math.abs(scrollY - targetY) < 700) {
                    node.classList.add('active');
                } else {
                    node.classList.remove('active');
                }
            });

            if (layerMountains) {
                const moveY = scrollY * 0.72;
                const shiftX = mouseX * 28;
                const shiftY = mouseY * 12;
                layerMountains.style.transform = `translate3d(calc(-50% + ${shiftX.toFixed(1)}px), ${(moveY + shiftY).toFixed(1)}px, 0)`;
            }

            if (layerRim) {
                const moveY = scrollY * 0.44;
                const shiftX = mouseX * 20;
                const shiftY = mouseY * 8;
                layerRim.style.transform = `translate3d(calc(-50% + ${shiftX.toFixed(1)}px), ${(moveY + shiftY).toFixed(1)}px, 0)`;
            }

            if (layerTemples) {
                const moveY = scrollY * 0.22;
                const shiftX = mouseX * 16;
                const shiftY = mouseY * 6;
                layerTemples.style.transform = `translate3d(calc(-50% + ${shiftX.toFixed(1)}px), ${(moveY + shiftY).toFixed(1)}px, 0)`;
            }

            if (layerMecha) {
                const moveY = scrollY * 0.10;
                const shiftX = mouseX * 14;
                const shiftY = mouseY * 5;
                layerMecha.style.transform = `translate3d(calc(-50% + ${shiftX.toFixed(1)}px), ${(moveY + shiftY).toFixed(1)}px, 0)`;
            }

            if (layerPrincess) {
                const moveY = scrollY * 0.10;
                const shiftX = mouseX * 14;
                const shiftY = mouseY * 5;
                layerPrincess.style.transform = `translate3d(calc(-50% + ${shiftX.toFixed(1)}px), ${(moveY + shiftY).toFixed(1)}px, 0)`;
            }

            if (layerCanyonStream) {
                const moveY = scrollY * 0.32;
                const shiftX = mouseX * 12;
                layerCanyonStream.style.transform = `translate3d(calc(-50% + ${shiftX.toFixed(1)}px), ${moveY.toFixed(1)}px, 0)`;
            }

            if (layerMidgroundCaverns) {
                const rect = layerMidgroundCaverns.getBoundingClientRect();
                if (rect.top < windowH + 600 && rect.bottom > -600) {
                    const offsetFromCenter = (windowH / 2) - (rect.top + rect.height / 2);
                    const moveY = offsetFromCenter * 0.20;
                    const shiftX = mouseX * 18;
                    layerMidgroundCaverns.style.transform = `translate3d(calc(-50% + ${shiftX.toFixed(1)}px), ${moveY.toFixed(1)}px, 0)`;
                }
            }

            if (layerForegroundRocks) {
                const rect = layerForegroundRocks.getBoundingClientRect();
                if (rect.top < windowH + 600 && rect.bottom > -600) {
                    const offsetFromCenter = (windowH / 2) - (rect.top + rect.height / 2);
                    const moveY = offsetFromCenter * 0.42;
                    const shiftX = mouseX * 26;
                    layerForegroundRocks.style.transform = `translate3d(calc(-50% + ${shiftX.toFixed(1)}px), ${moveY.toFixed(1)}px, 0)`;
                }
            }

            if (layerMetalPart) {
                const rect = layerMetalPart.getBoundingClientRect();
                if (rect.top < windowH + 600 && rect.bottom > -600) {
                    const offsetFromCenter = (windowH / 2) - (rect.top + rect.height / 2);
                    const moveY = offsetFromCenter * 0.22;
                    const shiftX = mouseX * 18;
                    layerMetalPart.style.transform = `translate3d(calc(-50% + ${shiftX.toFixed(1)}px), ${moveY.toFixed(1)}px, 0)`;
                }
            }

            floatCards.forEach(el => {
                const speed = parseFloat(el.getAttribute('data-float-speed')) || 0.22;
                const rect = el.getBoundingClientRect();

                if (rect.top < windowH + 500 && rect.bottom > -500) {
                    const offsetFromCenter = (windowH / 2) - (rect.top + rect.height / 2);
                    const translateY = offsetFromCenter * speed;

                    const isCentered = el.classList.contains('center-x') || el.id === 'speeder-water-rush' || el.classList.contains('holo-wireframe-cluster');
                    const xBase = isCentered ? '-50%' : '0px';
                    const mouseShiftX = (mouseX * speed * 45).toFixed(1);

                    el.style.transform = `translate3d(calc(${xBase} + ${mouseShiftX}px), ${translateY.toFixed(1)}px, 0)`;
                }
            });

            requestAnimationFrame(updateParallax);
        }

        requestAnimationFrame(updateParallax);

        function scrollToY(y) {
            window.scrollTo({
                top: y,
                behavior: 'smooth'
            });
        }

        function switchHoloSet(setName) {
            const tabs = document.querySelectorAll('.holo-tab');
            const grids = document.querySelectorAll('.holo-panels-grid');
            tabs.forEach(t => t.classList.remove('active'));
            grids.forEach(g => g.classList.remove('active'));
            if (setName === 'renders') {
                tabs[0]?.classList.add('active');
                document.getElementById('holo-set-renders')?.classList.add('active');
            } else {
                tabs[1]?.classList.add('active');
                document.getElementById('holo-set-wireframes')?.classList.add('active');
            }
        }

        const modal = document.getElementById('lightboxModal');
        const modalImg = document.getElementById('lightboxImg');
        const modalCaption = document.getElementById('lightboxCaption');

        function openLightbox(src, caption) {
            if (!modal || !modalImg) return;
            modalImg.src = src;
            modalCaption.textContent = caption || '';
            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox() {
            if (!modal) return;
            modal.classList.remove('active');
            document.body.style.overflow = '';
            setTimeout(() => {
                if (modalImg) modalImg.src = '';
            }, 300);
        }

        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && modal.classList.contains('active')) {
                closeLightbox();
            }
        });

        // PASO 1: EFECTO DE LETRAS KPR (SIN INTERFERIR CON CLICS)
        const kprGlyphs = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789//<>[]";
        function runKprHack(el) {
            const original = el.getAttribute('data-value') || el.textContent;
            let iter = 0;
            clearInterval(el._kprInterval);
            el._kprInterval = setInterval(() => {
                el.textContent = original.split('').map((c, i) => {
                    if (i < iter || c === ' ') return original[i];
                    return kprGlyphs[Math.floor(Math.random() * kprGlyphs.length)];
                }).join('');
                if (iter >= original.length) clearInterval(el._kprInterval);
                iter += 0.5;
            }, 25);
        }

        document.querySelectorAll('.kpr-hack').forEach(el => {
            el.addEventListener('mouseenter', () => runKprHack(el));
        });
    </script>
