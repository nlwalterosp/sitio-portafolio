<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Canto del Quetzal | Experiencia Parallax 3D</title>
    
    <!-- Tipografías oficiales del portafolio -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        /* ==========================================================
           1. VARIABLES Y CONFIGURACIÓN BASE
           ========================================================== */
        :root {
            --cyan-neon: #00f2fe;
            --cyan-glow: rgba(0, 242, 254, 0.45);
            --cyan-glass: rgba(10, 24, 36, 0.82);
            --sand-header: #ede6d3;
            --sand-text: #2c2923;
            --canyon-dark: #0d141c;
            --font-display: "Inter Tight", sans-serif;
            --font-body: "Inter", sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            background-color: var(--canyon-dark);
        }

        body {
            width: 100%;
            min-height: 100vh;
            background-color: var(--canyon-dark);
            color: #ffffff;
            font-family: var(--font-body);
            overflow-x: hidden;
            position: relative;
        }

        /* Bloquea el scroll de fondo mientras la intro blanca está activa */
        body.intro-locked {
            overflow: hidden;
        }

        /* Barra de scroll personalizada */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #090e14;
        }
        ::-webkit-scrollbar-thumb {
            background: #00f2fe55;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #00f2feaa;
        }

        /* ==========================================================
           0. PANTALLA DE INTRO BLANCA (DOT SCATTER + ZOOM OUT)
           ========================================================== */
        .scatter-intro-overlay {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            background-color: #EFECEC;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            user-select: none;
            touch-action: manipulation;
            cursor: pointer;
            clip-path: inset(0% 0% 0% 0% round 0px);
            transition:
                clip-path 1.25s cubic-bezier(0.77, 0, 0.175, 1) 0.25s,
                opacity 0.95s ease 0.55s,
                visibility 0s linear 1.55s;
        }

        /* Estado cuando se activa el Zoom Out y se abre la página */
        .scatter-intro-overlay.zoom-out-open {
            clip-path: inset(50% 50% 50% 50% round 40px);
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .scatter-svg-stage {
            position: relative;
            width: 100%;
            height: 100%;
            transform: scale(1);
            transform-origin: center center;
            transition: transform 1.15s cubic-bezier(0.19, 1, 0.22, 1), opacity 0.9s ease 0.2s;
            will-change: transform, opacity;
        }

        /* El texto se hace más pequeño (Zoom Out) antes de abrirse la página */
        .scatter-intro-overlay.zoom-out-open .scatter-svg-stage {
            transform: scale(0.28);
            opacity: 0;
        }

        .scatter-svg-stage svg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
        }

        .scatter-enter-cta {
            position: absolute;
            bottom: 42px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            font-family: var(--font-display);
            font-size: 0.78rem;
            font-weight: 800;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #1a1a1a;
            background: rgba(255, 255, 255, 0.7);
            border: 1.5px solid rgba(0, 0, 0, 0.18);
            padding: 12px 26px;
            border-radius: 30px;
            backdrop-filter: blur(6px);
            cursor: pointer;
            transition: all 0.35s ease;
            z-index: 5;
        }

        .scatter-enter-cta:hover {
            background: #000000;
            color: #EFECEC;
            transform: translateX(-50%) translateY(-3px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
        }

        .scatter-intro-overlay.zoom-out-open .scatter-enter-cta {
            opacity: 0;
            transform: translateX(-50%) scale(0.8);
        }

        /* ==========================================================
           TRANSICIÓN SUAVE DE IMÁGENES AL ENTRAR Y AL HACER SCROLL
           ========================================================== */
        .landing-stage img {
            opacity: 0;
            transform: scale(1.04);
            transition: opacity 1.2s cubic-bezier(0.22, 1, 0.36, 1), transform 1.4s cubic-bezier(0.22, 1, 0.36, 1);
        }

        /* Cuando se abre la intro, las capas del paisaje aparecen escalonadas suavemente */
        body.page-revealed #layer-mountains img { opacity: 1; transform: scale(1); transition-delay: 0.10s; }
        body.page-revealed #layer-canyon-rim img { opacity: 1; transform: scale(1); transition-delay: 0.22s; }
        body.page-revealed #layer-temples img { opacity: 1; transform: scale(1); transition-delay: 0.34s; }
        body.page-revealed #layer-canyon-stream img { opacity: 1; transform: scale(1); transition-delay: 0.44s; }
        body.page-revealed #layer-mecha img { opacity: 1; transform: scale(1); transition-delay: 0.56s; }
        body.page-revealed #layer-princess-hero img { opacity: 1; transform: scale(1); transition-delay: 0.68s; }
        body.page-revealed #layer-midground-caverns img,
        body.page-revealed #layer-foreground-rocks img,
        body.page-revealed #layer-metal-part img {
            opacity: 1;
            transform: scale(1);
            transition-delay: 0.3s;
        }

        /* Aparición suave de tarjetas HUD y elementos interactivos cuando entran en pantalla */
        .smooth-reveal-item {
            opacity: 0;
            transition: opacity 0.95s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.35s ease, border-color 0.35s ease;
        }

        .smooth-reveal-item.is-visible {
            opacity: 1;
        }

        .smooth-reveal-item.is-visible img {
            opacity: 1;
            transform: scale(1);
        }

        /* ==========================================================
           2. HEADER ORGÁNICO SUPERIOR (ESTILO REFERENCIA)
           ========================================================== */
        .site-header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            pointer-events: none;
            opacity: 0;
            transform: translateY(-30px);
            transition: transform 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.4s, opacity 0.9s ease 0.4s;
        }

        body.page-revealed .site-header {
            opacity: 1;
            transform: translateY(0);
        }

        .header-curve-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 85px;
            background: var(--sand-header);
            border-bottom-left-radius: 45% 25px;
            border-bottom-right-radius: 45% 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
            z-index: 1;
            pointer-events: none;
        }

        .header-content {
            position: relative;
            z-index: 2;
            pointer-events: auto;
            max-width: 1500px;
            margin: 0 auto;
            padding: 14px 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 14px;
            text-decoration: none;
            color: var(--sand-text);
            cursor: pointer;
        }

        .brand-logo img {
            height: 42px;
            width: auto;
            object-fit: contain;
        }

        .brand-title {
            display: flex;
            flex-direction: column;
        }

        .brand-title h1 {
            font-family: var(--font-display);
            font-size: 1.35rem;
            font-weight: 900;
            letter-spacing: 0.5px;
            color: #1a4231;
            line-height: 1;
            text-transform: uppercase;
        }

        .brand-title span {
            font-family: var(--font-display);
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 2.5px;
            color: #2b7a59;
            text-transform: uppercase;
            margin-top: 2px;
        }

        .main-nav {
            display: flex;
            align-items: center;
            gap: 24px;
            pointer-events: auto;
        }

        .main-nav a {
            text-decoration: none;
            font-family: var(--font-display);
            font-size: 0.85rem;
            font-weight: 700;
            color: #444037;
            padding: 6px 14px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .main-nav a:hover {
            color: #0b2216;
            background: rgba(0, 0, 0, 0.08);
            transform: translateY(-1px);
        }

        .main-nav a.btn-back {
            background: #1a4231;
            color: #ffffff;
            padding: 8px 18px;
        }

        .main-nav a.btn-back:hover {
            background: #000000;
            color: var(--cyan-neon);
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.35);
        }

        /* ==========================================================
           3. HUD LATERAL DE PROFUNDIDAD
           ========================================================== */
        .depth-meter {
            position: fixed;
            right: 28px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 900;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 16px;
            pointer-events: auto;
            opacity: 0;
            transition: opacity 1s ease 0.6s;
        }

        body.page-revealed .depth-meter {
            opacity: 1;
        }

        .depth-track {
            position: relative;
            width: 2px;
            height: 240px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 2px;
            overflow: hidden;
            margin-right: 12px;
        }

        .depth-fill {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 0%;
            background: linear-gradient(180deg, var(--cyan-neon), #00a8ff);
            box-shadow: 0 0 12px var(--cyan-neon);
            transition: height 0.1s ease-out;
        }

        .depth-node {
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: var(--font-display);
            font-size: 0.68rem;
            font-weight: 700;
            letter-spacing: 1px;
            color: rgba(255, 255, 255, 0.4);
            cursor: pointer;
            transition: all 0.3s ease;
            background: transparent;
            border: none;
        }

        .depth-node .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transition: all 0.3s ease;
        }

        .depth-node:hover,
        .depth-node.active {
            color: var(--cyan-neon);
            text-shadow: 0 0 8px var(--cyan-neon);
        }

        .depth-node:hover .dot,
        .depth-node.active .dot {
            background: var(--cyan-neon);
            box-shadow: 0 0 10px var(--cyan-neon);
            transform: scale(1.6);
        }

        /* ==========================================================
           4. ESCENARIO VERTICAL FULL-WIDTH (SIN BORDES NI RECORTES)
           ========================================================== */
        .landing-stage {
            position: relative;
            width: 100%;
            min-height: 7800px;
            overflow-x: hidden;
            background: linear-gradient(180deg, #9bb8c6 0%, #15222e 700px, #0e1720 2800px, #0c1219 5000px, #080d12 100%);
        }

        .full-bleed-layer {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            width: 100vw;
            min-width: 100%;
            pointer-events: none;
            will-change: transform;
        }

        .full-bleed-layer img {
            width: 100%;
            height: auto;
            display: block;
            user-select: none;
        }

        .center-x {
            left: 50%;
            transform: translateX(-50%);
        }

        /* ==========================================================
           5. APILAMIENTO EXACTO DE CAPAS (ORDEN DIAGRAMA DEL USUARIO)
           ========================================================== */
        #layer-mountains {
            top: 0px;
            z-index: 1;
            opacity: 0.98;
        }

        #layer-canyon-rim {
            top: 100px;
            z-index: 2;
        }

        #layer-temples {
            top: clamp(100px, 8vw, 150px);
            z-index: 3;
            filter: drop-shadow(0 15px 30px rgba(0, 0, 0, 0.55));
        }

        #layer-mecha {
            position: absolute;
            top: calc(clamp(480px, 35vw, 620px) + 280px);
            left: calc(50% + clamp(-10px, 0vw, 15px));
            transform: translateX(-50%);
            width: clamp(700px, 50vw, 940px);
            max-width: 56vw;
            z-index: 5;
            pointer-events: none;
            will-change: transform;
            filter: drop-shadow(0 20px 40px rgba(0, 0, 0, 0.8));
        }

        #layer-mecha img {
            width: 100%;
            height: auto;
            display: block;
            user-select: none;
        }

        #layer-princess-hero {
            position: absolute;
            top: calc(clamp(160px, 12vw, 220px) + 2.5cm + 280px);
            left: calc(50% + clamp(15px, 1.8vw, 35px));
            transform: translateX(-50%);
            width: clamp(300px, 22vw, 420px);
            height: calc(clamp(300px, 22vw, 420px) * 1.016);
            overflow: hidden;
            z-index: 7;
            pointer-events: none;
            will-change: transform;
            filter: drop-shadow(0 20px 35px rgba(0, 0, 0, 0.85));
        }
        #layer-princess-hero img {
            width: 100%;
            height: auto;
            display: block;
        }

        #layer-canyon-stream {
            top: 920px;
            z-index: 4;
            opacity: 0.98;
            filter: drop-shadow(0 0 50px rgba(0, 0, 0, 0.85));
        }

        /* Segundo plano cascada bajado a 3680px para tapar el hueco negro */
        #layer-midground-caverns {
            top: 3680px;
            z-index: 7;
            filter: drop-shadow(0 25px 45px rgba(0, 0, 0, 0.75));
        }

        #layer-foreground-rocks {
            top: 4400px;
            z-index: 8;
            filter: drop-shadow(0 35px 65px rgba(0, 0, 0, 0.95));
        }

        #layer-metal-part {
            position: absolute;
            top: 6950px;
            left: calc(50% + clamp(180px, 17vw, 290px));
            transform: translateX(-50%);
            width: clamp(520px, 45vw, 750px);
            z-index: 8;
            filter: drop-shadow(0 20px 45px rgba(0, 0, 0, 0.85));
            pointer-events: none;
            will-change: transform;
        }

        #layer-metal-part img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* ==========================================================
           6. TARJETAS HUD FLOTANTES (ORDEN CRONOLÓGICO DIAPO 1, 2, 3 Y 4)
           ========================================================== */
        .hud-card {
            position: absolute;
            background: var(--cyan-glass);
            border: 1.5px solid var(--cyan-glow);
            border-radius: 22px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.75), 0 0 35px rgba(0, 242, 254, 0.25), inset 0 0 20px rgba(0, 242, 254, 0.08);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            overflow: hidden;
            pointer-events: auto;
            cursor: pointer;
            z-index: 20;
            will-change: transform, opacity;
        }

        .hud-card:hover {
            border-color: var(--cyan-neon);
            box-shadow: 0 30px 65px rgba(0, 0, 0, 0.85), 0 0 50px rgba(0, 242, 254, 0.55);
        }

        .hud-card img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 18px;
            pointer-events: none;
        }

        #card-kaya-calla {
            top: calc(clamp(640px, 46vw, 790px) + 6.5cm + 280px);
            left: calc(50% + clamp(200px, 18vw, 320px));
            transform: translateX(-50%);
            width: clamp(390px, 31vw, 560px);
            padding: 12px;
            border-radius: 20px;
            border: 1.5px solid var(--cyan-neon);
            box-shadow: 0 0 30px rgba(0, 242, 254, 0.35), inset 0 0 15px rgba(0, 242, 254, 0.1);
            z-index: 20;
        }

        #card-pose-thumbnail {
            top: calc(clamp(660px, 48vw, 820px) + 6.5cm + 280px);
            left: calc(50% - clamp(280px, 27vw, 480px));
            transform: translateX(-50%);
            width: clamp(165px, 13vw, 220px);
            padding: 10px;
            border-radius: 0;
            clip-path: polygon(26px 0%, 100% 0%, 100% 100%, 0% 100%, 0% 26px);
            border: 1.5px solid var(--cyan-neon);
            box-shadow: 0 0 25px rgba(0, 242, 254, 0.4), inset 0 0 15px rgba(0, 242, 254, 0.15);
            z-index: 20;
        }

        #card-diapo-1 {
            top: 2100px;
            left: calc(50% + clamp(260px, 24vw, 420px));
            transform: translateX(-50%);
            width: clamp(480px, 44vw, 700px);
            max-width: min(700px, calc(100vw - 40px));
            padding: 12px;
            border-radius: 20px;
            z-index: 20;
        }

        #card-diapo-2 {
            top: 3150px;
            left: calc(50% - clamp(260px, 24vw, 420px));
            transform: translateX(-50%);
            width: clamp(480px, 44vw, 700px);
            max-width: min(700px, calc(100vw - 40px));
            padding: 14px;
            border-radius: 22px;
            z-index: 20;
        }

        #card-diapo-3 {
            top: 4200px;
            left: calc(50% + clamp(260px, 24vw, 420px));
            transform: translateX(-50%);
            width: clamp(480px, 44vw, 700px);
            max-width: min(700px, calc(100vw - 40px));
            padding: 14px;
            border-radius: 22px;
            z-index: 20;
        }

        /* Princesa con motocicleta agrandada */
        #speeder-water-rush {
            position: absolute;
            top: 5080px;
            left: 50%;
            transform: translateX(-50%);
            width: clamp(450px, 38vw, 650px);
            max-width: 46vw;
            z-index: 15;
            pointer-events: none;
            filter: drop-shadow(0 20px 45px rgba(0, 0, 0, 0.85)) drop-shadow(0 0 35px rgba(0, 242, 254, 0.7));
        }

        #speeder-water-rush img {
            width: 100%;
            height: auto;
            display: block;
            animation: speederHover 4s ease-in-out infinite alternate;
        }

        @keyframes speederHover {
            0% { transform: translateY(0px) rotate(-1deg); }
            100% { transform: translateY(-16px) rotate(1.5deg); }
        }

        /* ==========================================================
           DEPTH GALLERY (ORIGINKIT / CODROPS) EN VANILLA JS
           ========================================================== */
        .holo-wireframe-cluster {
            position: absolute;
            top: 5560px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            z-index: 25;
            pointer-events: auto;
            will-change: transform, opacity;
            width: clamp(340px, 68vw, 920px);
        }

        .holo-cluster-nav {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
            z-index: 5;
        }

        .holo-tab {
            background: rgba(10, 24, 36, 0.85);
            border: 1px solid rgba(0, 242, 254, 0.4);
            color: rgba(255, 255, 255, 0.75);
            font-family: var(--font-display);
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 1px;
            padding: 8px 18px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .holo-tab:hover,
        .holo-tab.active {
            color: #000;
            background: var(--cyan-neon);
            border-color: var(--cyan-neon);
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.5);
        }

        .depth-gallery-stage {
            position: relative;
            width: 100%;
            height: 540px;
            border-radius: 24px;
            overflow: hidden;
            border: 1.5px solid var(--cyan-glow);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.85), 0 0 40px rgba(0, 242, 254, 0.22);
            cursor: grab;
            user-select: none;
            touch-action: pan-x;
            background: #08131d;
        }

        .depth-gallery-stage:active {
            cursor: grabbing;
        }

        .dg-ground {
            position: absolute;
            inset: 0;
            pointer-events: none;
            transition: background 0.1s linear;
        }

        .dg-grain {
            position: absolute;
            inset: 0;
            background-size: 128px 128px;
            opacity: 0.1;
            mix-blend-mode: overlay;
            pointer-events: none;
        }

        .dg-corridor {
            position: absolute;
            inset: 0;
            perspective-origin: 50% 50%;
            transform-style: preserve-3d;
            pointer-events: none;
        }

        .dg-plate {
            position: absolute;
            left: 50%;
            top: 50%;
            overflow: hidden;
            backface-visibility: hidden;
            visibility: hidden;
            opacity: 0;
            will-change: transform, opacity;
            border: 1.5px solid rgba(0, 242, 254, 0.65);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.75), 0 0 30px rgba(0, 242, 254, 0.25);
            background: rgba(8, 22, 34, 0.85);
            backdrop-filter: blur(8px);
        }

        .dg-plate img {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: contain;
            padding: 18px;
            pointer-events: none;
            opacity: 1 !important;
            transform: none !important;
            filter: drop-shadow(0 0 14px rgba(0, 242, 254, 0.45));
        }

        .dg-plate-tag {
            position: absolute;
            top: 12px;
            left: 14px;
            right: 14px;
            display: flex;
            justify-content: space-between;
            font-family: var(--font-display);
            font-size: 0.72rem;
            font-weight: 800;
            letter-spacing: 2px;
            color: var(--cyan-neon);
            text-transform: uppercase;
            text-shadow: 0 0 8px rgba(0, 242, 254, 0.8);
            pointer-events
