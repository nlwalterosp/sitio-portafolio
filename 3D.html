<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Canto del Quetzal | Experiencia Parallax 3D</title>
    
    <!-- Tipografías oficiales del portafolio -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        /* ==========================================================
           1. VARIABLES Y CONFIGURACIÓN BASE
           ========================================================== */
        :root {
            --cyan-neon: #00f2fe;
            --cyan-glow: rgba(0, 242, 254, 0.45);
            --cyan-glass: rgba(10, 24, 36, 0.82);
            --sand-header: #ede6d3;
            --sand-text: #2c2923;
            --canyon-dark: #0d141c;
            --font-display: "Inter Tight", sans-serif;
            --font-body: "Inter", sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
            background-color: var(--canyon-dark);
        }

        body {
            width: 100%;
            min-height: 100vh;
            background-color: var(--canyon-dark);
            color: #ffffff;
            font-family: var(--font-body);
            overflow-x: hidden;
            position: relative;
        }

        /* Barra de scroll personalizada */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #090e14;
        }
        ::-webkit-scrollbar-thumb {
            background: #00f2fe55;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #00f2feaa;
        }

        /* ==========================================================
           2. HEADER ORGÁNICO SUPERIOR (ESTILO REFERENCIA)
           ========================================================== */
        .site-header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            pointer-events: none;
            transition: transform 0.3s ease;
        }

        .header-curve-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 85px;
            background: var(--sand-header);
            border-bottom-left-radius: 45% 25px;
            border-bottom-right-radius: 45% 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
            z-index: 1;
        }

        .header-content {
            position: relative;
            z-index: 2;
            pointer-events: auto;
            max-width: 1500px;
            margin: 0 auto;
            padding: 14px 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 14px;
            text-decoration: none;
            color: var(--sand-text);
        }

        .brand-logo img {
            height: 42px;
            width: auto;
            object-fit: contain;
        }

        .brand-title {
            display: flex;
            flex-direction: column;
        }

        .brand-title h1 {
            font-family: var(--font-display);
            font-size: 1.35rem;
            font-weight: 900;
            letter-spacing: 0.5px;
            color: #1a4231;
            line-height: 1;
            text-transform: uppercase;
        }

        .brand-title span {
            font-family: var(--font-display);
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 2.5px;
            color: #2b7a59;
            text-transform: uppercase;
            margin-top: 2px;
        }

        .main-nav {
            display: flex;
            align-items: center;
            gap: 24px;
        }

        .main-nav a {
            text-decoration: none;
            font-family: var(--font-display);
            font-size: 0.85rem;
            font-weight: 700;
            color: #444037;
            padding: 6px 14px;
            border-radius: 20px;
            transition: all 0.25s ease;
        }

        .main-nav a:hover {
            color: #0b2216;
            background: rgba(0, 0, 0, 0.08);
            transform: translateY(-1px);
        }

        .main-nav a.btn-back {
            background: #1a4231;
            color: #ffffff;
            padding: 8px 18px;
        }

        .main-nav a.btn-back:hover {
            background: #000000;
            color: var(--cyan-neon);
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.35);
        }

        /* ==========================================================
           3. HUD LATERAL DE PROFUNDIDAD
           ========================================================== */
        .depth-meter {
            position: fixed;
            right: 28px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 900;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 16px;
            pointer-events: auto;
        }

        .depth-track {
            position: relative;
            width: 2px;
            height: 240px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 2px;
            overflow: hidden;
            margin-right: 12px;
        }

        .depth-fill {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 0%;
            background: linear-gradient(180deg, var(--cyan-neon), #00a8ff);
            box-shadow: 0 0 12px var(--cyan-neon);
            transition: height 0.1s ease-out;
        }

        .depth-node {
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: var(--font-display);
            font-size: 0.68rem;
            font-weight: 700;
            letter-spacing: 1px;
            color: rgba(255, 255, 255, 0.4);
            cursor: pointer;
            transition: all 0.3s ease;
            background: transparent;
            border: none;
        }

        .depth-node .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transition: all 0.3s ease;
        }

        .depth-node:hover,
        .depth-node.active {
            color: var(--cyan-neon);
            text-shadow: 0 0 8px var(--cyan-neon);
        }

        .depth-node:hover .dot,
        .depth-node.active .dot {
            background: var(--cyan-neon);
            box-shadow: 0 0 10px var(--cyan-neon);
            transform: scale(1.6);
        }

        /* ==========================================================
           4. ESCENARIO VERTICAL FULL-WIDTH (SIN BORDES NI RECORTES)
           ========================================================== */
        .landing-stage {
            position: relative;
            width: 100%;
            min-height: 5200px;
            overflow-x: hidden;
            background: linear-gradient(180deg, #9bb8c6 0%, #15222e 700px, #0e1720 2000px, #0c1219 3800px, #080d12 100%);
        }

        /* Capas de ancho completo para eliminar espacios sobrantes */
        .full-bleed-layer {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            width: 100vw;
            min-width: 100%;
            pointer-events: none;
            will-change: transform;
        }

        .full-bleed-layer img {
            width: 100%;
            height: auto;
            display: block;
            user-select: none;
        }

        .center-x {
            left: 50%;
            transform: translateX(-50%);
        }

        /* ==========================================================
           5. APILAMIENTO EXACTO DE CAPAS (ORDEN DIAGRAMA DEL USUARIO)
           ========================================================== */

        /* CAPA 1: Montañas del fondo (Furthest back) */
        #layer-mountains {
            top: 0px;
            z-index: 1;
            opacity: 0.98;
        }

        /* CAPA 2: Paredes del cañón con torres y puertas de piedra (fondo2.png) */
        #layer-canyon-rim {
            top: 130px;
            z-index: 2;
        }

        /* CAPA 4 en diagrama: Edificios y mecha tanque encima de fondo2 */
        #layer-temples {
            top: 260px;
            z-index: 3;
            filter: drop-shadow(0 15px 30px rgba(0, 0, 0, 0.55));
        }

        /* CAPA 5 en diagrama: Cascada superior que baja desde el mecha hacia abajo */
        #layer-waterfall-drop {
            top: 640px; /* Sube para conectar directamente bajo el mecha */
            z-index: 4;
            mix-blend-mode: screen;
            filter: drop-shadow(0 0 35px rgba(0, 242, 254, 0.45));
        }

        /* CAPA 3 en diagrama: Princesa Ixk'uk sentada sobre el mecha (MÁS PEQUEÑA) */
        #layer-princess-hero {
            position: absolute;
            top: 155px;
            left: 50%;
            transform: translateX(-50%);
            width: 440px; /* Redimensionada para encajar perfectamente sobre el tanque */
            max-width: 32vw;
            z-index: 5;
            pointer-events: none;
            will-change: transform;
            filter: drop-shadow(0 20px 35px rgba(0, 0, 0, 0.8));
        }
        #layer-princess-hero img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* FONDO COMPLETO DEL CAÑÓN (fondo3.png: columna vertebral continua) */
        #layer-canyon-stream {
            top: 680px;
            z-index: 2;
            opacity: 0.95;
            filter: drop-shadow(0 0 60px rgba(0, 0, 0, 0.85));
        }

        /* CAPA 6 en diagrama: Cavernas intermedias y lagunas (segundo plano) */
        #layer-midground-caverns {
            top: 2280px;
            z-index: 6;
            filter: drop-shadow(0 25px 45px rgba(0, 0, 0, 0.75));
        }

        /* CAPA 7 en diagrama: Primer plano rocoso frontal con estatua y río */
        #layer-foreground-rocks {
            top: 3120px;
            z-index: 8;
            filter: drop-shadow(0 35px 65px rgba(0, 0, 0, 0.95));
        }

        /* ==========================================================
           6. TARJETAS HUD FLOTANTES (ORDEN CRONOLÓGICO DIAPO 1, 2, 3 Y 4)
           ========================================================== */
        .hud-card {
            position: absolute;
            background: var(--cyan-glass);
            border: 1.5px solid var(--cyan-glow);
            border-radius: 22px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.75), 0 0 35px rgba(0, 242, 254, 0.25), inset 0 0 20px rgba(0, 242, 254, 0.08);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            overflow: hidden;
            pointer-events: auto;
            cursor: pointer;
            z-index: 10;
            will-change: transform;
            transition: box-shadow 0.35s ease, border-color 0.35s ease;
        }

        .hud-card:hover {
            border-color: var(--cyan-neon);
            box-shadow: 0 30px 65px rgba(0, 0, 0, 0.85), 0 0 50px rgba(0, 242, 254, 0.55);
        }

        .hud-card img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 18px;
        }

        /* 1. SECCIÓN SUPERIOR: DIAPOSITIVA 1 (Turnaround, swatches y lettering "UK") */
        #card-diapo-1 {
            top: 1160px;
            right: 4%;
            width: 480px;
            max-width: 36vw;
            padding: 12px;
        }

        /* Miniatura de pose en roca (Izquierda) */
        #card-pose-thumbnail {
            top: 1120px;
            left: 4%;
            width: 190px;
            max-width: 16vw;
            padding: 8px;
            border-radius: 16px;
        }

        /* 2. SECCIÓN MEDIA: DIAPOSITIVA 2 (Expresiones faciales Serious, Confused, Fearful) */
        #card-diapo-2 {
            top: 1960px;
            left: 4%;
            width: 480px;
            max-width: 36vw;
            padding: 12px;
        }

        /* 3. SECCIÓN MEDIA: DIAPOSITIVA 3 (Medallón rojo del Quetzal y Lore) */
        #card-diapo-3 {
            top: 2080px;
            right: 4%;
            width: 460px;
            max-width: 36vw;
            padding: 12px;
        }

        /* 4. SECCIÓN LAGUNA 3D: Speeder en el agua y Paneles holográficos */
        #speeder-water-rush {
            position: absolute;
            top: 2900px;
            left: 50%;
            transform: translateX(-50%);
            width: 500px;
            max-width: 42vw;
            z-index: 9;
            pointer-events: none;
            filter: drop-shadow(0 0 35px rgba(0, 242, 254, 0.65));
            animation: speederHover 4s ease-in-out infinite alternate;
        }

        @keyframes speederHover {
            0% { transform: translateX(-50%) translateY(0px) rotate(-1deg); }
            100% { transform: translateX(-50%) translateY(-12px) rotate(1deg); }
        }

        .holo-wireframe-cluster {
            position: absolute;
            top: 3120px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 22px;
            align-items: flex-end;
            z-index: 10;
            pointer-events: auto;
            will-change: transform;
        }

        .holo-panel {
            position: relative;
            width: 165px;
            max-width: 14vw;
            background: rgba(0, 242, 254, 0.08);
            border: 1.5px solid rgba(0, 242, 254, 0.7);
            border-radius: 14px;
            padding: 8px;
            backdrop-filter: blur(8px);
            box-shadow: 0 0 25px rgba(0, 242, 254, 0.3), inset 0 0 15px rgba(0, 242, 254, 0.15);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .holo-panel:hover {
            transform: translateY(-10px) scale(1.06);
            border-color: #ffffff;
            box-shadow: 0 0 40px var(--cyan-neon);
        }

        .holo-panel .holo-tag {
            font-family: var(--font-display);
            font-size: 0.75rem;
            font-weight: 800;
            color: var(--cyan-neon);
            letter-spacing: 2px;
            text-transform: uppercase;
            text-align: center;
            margin-bottom: 6px;
            text-shadow: 0 0 8px var(--cyan-neon);
        }

        .holo-panel img {
            width: 100%;
            height: auto;
            mix-blend-mode: screen;
            filter: brightness(1.2) drop-shadow(0 0 10px rgba(0, 242, 254, 0.5));
        }

        /* 5. SECCIÓN INFERIOR: DIAPOSITIVA 4 (Ficha técnica grande "PRINCESA IXK´UK") */
        #card-diapo-4 {
            top: 3950px;
            right: 4%;
            width: 500px;
            max-width: 38vw;
            padding: 12px;
            z-index: 10;
        }

        /* Tarjeta naranja: Render de estudio del speeder */
        #card-speeder-orange {
            top: 4260px;
            left: 4%;
            width: 440px;
            max-width: 34vw;
            background: linear-gradient(135deg, #f26829 0%, #c9440c 100%);
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 26px;
            padding: 14px;
            box-shadow: 0 20px 50px rgba(242, 104, 41, 0.5);
            z-index: 10;
        }

        /* Render 3D de la princesa explorando las ruinas */
        #render-nevera-ruins {
            position: absolute;
            top: 4300px;
            right: 12%;
            width: 270px;
            max-width: 20vw;
            z-index: 10;
            pointer-events: auto;
            cursor: pointer;
            filter: drop-shadow(0 20px 45px rgba(0, 0, 0, 0.85));
            will-change: transform;
            transition: transform 0.4s ease;
        }

        #render-nevera-ruins:hover {
            transform: scale(1.06) translateY(-5px);
        }

        /* ==========================================================
           7. MODAL LIGHTBOX
           ========================================================== */
        .lightbox-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(5, 12, 18, 0.94);
            backdrop-filter: blur(16px);
            z-index: 5000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .lightbox-modal.active {
            opacity: 1;
            pointer-events: auto;
        }

        .lightbox-container {
            position: relative;
            max-width: 90vw;
            max-height: 88vh;
            border: 2px solid var(--cyan-neon);
            border-radius: 20px;
            padding: 12px;
            background: rgba(10, 20, 30, 0.9);
            box-shadow: 0 0 50px rgba(0, 242, 254, 0.45);
            transform: scale(0.92);
            transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .lightbox-modal.active .lightbox-container {
            transform: scale(1);
        }

        .lightbox-img {
            max-width: 100%;
            max-height: 80vh;
            object-fit: contain;
            border-radius: 14px;
            display: block;
        }

        .lightbox-caption {
            margin-top: 10px;
            text-align: center;
            font-family: var(--font-display);
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--cyan-neon);
            letter-spacing: 1px;
        }

        .lightbox-close {
            position: absolute;
            top: -18px;
            right: -18px;
            width: 40px;
            height: 40px;
            background: var(--cyan-neon);
            color: #000;
            border: none;
            border-radius: 50%;
            font-size: 1.2rem;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 0 15px var(--cyan-neon);
            transition: transform 0.2s ease, background 0.2s ease;
        }

        .lightbox-close:hover {
            transform: scale(1.15) rotate(90deg);
            background: #ffffff;
        }

        /* Footer de navegación */
        .site-footer {
            position: relative;
            z-index: 100;
            width: 100%;
            padding: 80px 20px 100px;
            text-align: center;
            background: linear-gradient(180deg, transparent 0%, #060a0e 100%);
        }

        .site-footer h2 {
            font-family: var(--font-display);
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: 1px;
            color: #ffffff;
            margin-bottom: 24px;
        }

        .footer-links {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .footer-links a {
            text-decoration: none;
            font-family: var(--font-display);
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--cyan-neon);
            border: 1.5px solid var(--cyan-neon);
            padding: 10px 24px;
            border-radius: 30px;
            transition: all 0.3s ease;
        }

        .footer-links a:hover {
            background: var(--cyan-neon);
            color: #000;
            box-shadow: 0 0 25px rgba(0, 242, 254, 0.5);
            transform: translateY(-2px);
        }

        /* Ajustes responsive */
        @media (max-width: 860px) {
            .main-nav { display: none; }
            .depth-meter { display: none; }
            .hud-card { position: relative !important; width: 92% !important; margin: 30px auto !important; top: auto !important; left: auto !important; right: auto !important; }
            .holo-wireframe-cluster { position: relative !important; top: auto !important; left: auto !important; transform: none !important; margin: 40px auto !important; justify-content: center; }
        }
    </style>
</head>
<body>

    <!-- 1. HEADER ORGÁNICO SUPERIOR -->
    <header class="site-header">
        <div class="header-curve-bg"></div>
        <div class="header-content">
            <a href="index.html" class="brand-logo">
                <img src="images/LOGO-UNIDO.png" alt="Logo El Canto del Quetzal">
                <div class="brand-title">
                    <h1>El Canto</h1>
                    <span>Del Quetzal</span>
                </div>
            </a>

            <nav class="main-nav">
                <a href="#cumbre" onclick="scrollToY(0)">Cumbre Maya</a>
                <a href="#cascada" onclick="scrollToY(1160)">Cascada</a>
                <a href="#laguna" onclick="scrollToY(2900)">Laguna 3D</a>
                <a href="#santuario" onclick="scrollToY(3950)">Santuario</a>
                <a href="Ilustracion.html">Ilustración</a>
                <a href="bio.html">Bio</a>
                <a href="index.html" class="btn-back">&#8592; Menú Principal</a>
            </nav>
        </div>
    </header>

    <!-- 2. HUD LATERAL DE PROFUNDIDAD -->
    <aside class="depth-meter">
        <div class="depth-track">
            <div class="depth-fill" id="depthFill"></div>
        </div>
        <button class="depth-node active" onclick="scrollToY(0)">
            <span>01 // CUMBRE</span>
            <div class="dot"></div>
        </button>
        <button class="depth-node" onclick="scrollToY(1160)">
            <span>02 // CASCADA</span>
            <div class="dot"></div>
        </button>
        <button class="depth-node" onclick="scrollToY(2900)">
            <span>03 // LAGUNA HUD</span>
            <div class="dot"></div>
        </button>
        <button class="depth-node" onclick="scrollToY(3950)">
            <span>04 // SANTUARIO</span>
            <div class="dot"></div>
        </button>
    </aside>

    <!-- 3. ESCENARIO VERTICAL FULL-WIDTH -->
    <main class="landing-stage" id="landingStage">

        <!-- ====================================================
             A. CAPAS DEL PAISAJE (ORDEN EXACTO DEL DIAGRAMA)
             ==================================================== -->

        <!-- CAPA 1: Montañas del fondo (Fondo absoluto) -->
        <div class="full-bleed-layer" id="layer-mountains">
            <img src="images/montañas-del-fondo.png" alt="Montañas lejanas">
        </div>

        <!-- CAPA 2: Cañón superior y watchtowers (fondo2.png) -->
        <div class="full-bleed-layer" id="layer-canyon-rim">
            <img src="images/fondo2.png" alt="Paredes superiores del cañón">
        </div>

        <!-- CAPA 4 (en diagrama): Edificios mayas y mecha tanque encima de fondo2 -->
        <div class="full-bleed-layer" id="layer-temples">
            <img src="images/edificios 3.png" alt="Templos Mayas y Tanque">
        </div>

        <!-- CAPA 5 (en diagrama): Cascada superior que baja desde el mecha -->
        <div class="full-bleed-layer" id="layer-waterfall-drop">
            <img src="images/Cascada en cañón entre rocas.png" alt="Cascada entre rocas">
        </div>

        <!-- CAPA 3 (en diagrama): Princesa Ixk'uk sentada sobre el mecha (MÁS PEQUEÑA) -->
        <div id="layer-princess-hero">
            <img src="images/princesa dibujo quetzal sin fondo.png" alt="Princesa Ixk'uk y Quetzal">
        </div>

        <!-- FONDO CONTINUO DEL CAÑÓN (fondo3.png: recorre todo el descenso) -->
        <div class="full-bleed-layer" id="layer-canyon-stream">
            <img src="images/fondo3.png" alt="Cañón y Cascada">
        </div>

        <!-- CAPA 6 (en diagrama): Cavernas intermedias y lagunas (segundo plano) -->
        <div class="full-bleed-layer" id="layer-midground-caverns">
            <img src="images/segundo_plano_cascada_transparente.png" alt="Cavernas intermedias">
        </div>

        <!-- CAPA 7 (en diagrama): Primer plano frontal con estatua y río -->
        <div class="full-bleed-layer" id="layer-foreground-rocks">
            <img src="images/primer_plano_cascada_transparente.png" alt="Rocas del primer plano">
        </div>

        <!-- ====================================================
             B. CONTENIDO CRONOLÓGICO: DIAPOSITIVA 1, 2, 3 Y 4
             ==================================================== -->

        <!-- SECCIÓN 1: DIAPOSITIVA 1 (Turnaround, swatches y "UK") -->

    <!-- ==========================================================
       5. MOTOR JAVASCRIPT DEL PARALLAX 3D (SCROLL VELOCIDADES DIFERENCIADAS)
       ========================================================== -->
    <script>
        // Capas del Hero Superior
        const layerMountains = document.getElementById('layer-mountains');
        const layerRim = document.getElementById('layer-canyon-rim');
        const layerTemples = document.getElementById('layer-temples');
        const layerPrincess = document.getElementById('layer-princess-hero');
        const layerWaterfall = document.getElementById('layer-waterfall-drop');

        // Capas del cañón y elementos flotantes a lo largo del scroll
        const floatCards = document.querySelectorAll('[data-float-speed]');
        const depthFill = document.getElementById('depthFill');
        const depthNodes = document.querySelectorAll('.depth-node');
        const landingStage = document.getElementById('landingStage');

        let mouseX = 0;
        let mouseY = 0;
        let targetMouseX = 0;
        let targetMouseY = 0;

        // Escuchador del movimiento del mouse para profundidad 3D horizontal
        window.addEventListener('mousemove', (e) => {
            const halfW = window.innerWidth / 2;
            const halfH = window.innerHeight / 2;
            targetMouseX = (e.clientX - halfW) / halfW; // Rango -1 a 1
            targetMouseY = (e.clientY - halfH) / halfH;
        });

        // BUCLE PRINCIPAL DE ANIMACIÓN: window.addEventListener('scroll') optimizado a 60/120 FPS
        function updateParallax() {
            mouseX += (targetMouseX - mouseX) * 0.08;
            mouseY += (targetMouseY - mouseY) * 0.08;

            const scrollY = window.pageYOffset || document.documentElement.scrollTop;
            const windowH = window.innerHeight;
            const totalScroll = landingStage.scrollHeight - windowH;
            const progress = Math.min(Math.max(scrollY / (totalScroll || 1), 0), 1);

            // Actualizar HUD lateral de progreso
            if (depthFill) {
                depthFill.style.height = `${progress * 100}%`;
            }

            // Actualizar nodos activos del HUD lateral
            const checkpoints = [0, 1160, 2900, 3950];
            depthNodes.forEach((node, i) => {
                const targetY = checkpoints[i];
                if (Math.abs(scrollY - targetY) < 650) {
                    node.classList.add('active');
                } else {
                    node.classList.remove('active');
                }
            });

            // =======================================================
            // 1. VELOCIDADES DIFERENCIADAS DEL HERO SUPERIOR CON translateY
            // =======================================================
            // Montañas lejanas: se mueven muy lento (velocidad 0.50) -> gran distancia
            if (layerMountains) {
                const moveY = scrollY * 0.50;
                layerMountains.style.transform = `translate3d(calc(-50% + ${mouseX * 25}px), ${moveY.toFixed(1)}px, 0)`;
            }

            // Cañón superior / watchtowers: velocidad 0.32
            if (layerRim) {
                const moveY = scrollY * 0.32;
                layerRim.style.transform = `translate3d(calc(-50% + ${mouseX * 18}px), ${moveY.toFixed(1)}px, 0)`;
            }

            // Edificios mayas y tanque: velocidad 0.18
            if (layerTemples) {
                const moveY = scrollY * 0.18;
                layerTemples.style.transform = `translate3d(calc(-50% + ${mouseX * 14}px), ${moveY.toFixed(1)}px, 0)`;
            }

            // Cascada superior: velocidad 0.10
            if (layerWaterfall) {
                const moveY = scrollY * 0.10;
                layerWaterfall.style.transform = `translate3d(calc(-50% + ${mouseX * 10}px), ${moveY.toFixed(1)}px, 0)`;
            }

            // Princesa Ixk'uk: velocidad 0.04 (se desplaza casi en primer plano)
            if (layerPrincess) {
                const moveY = scrollY * 0.04;
                layerPrincess.style.transform = `translate3d(calc(-50% + ${mouseX * 8}px), ${moveY.toFixed(1)}px, 0)`;
            }

            // =======================================================
            // 2. PARALLAX FLOTANTE DE LAS TARJETAS HUD (DIAPOSITIVAS 1 A 4)
            // =======================================================
            floatCards.forEach(el => {
                const speed = parseFloat(el.getAttribute('data-float-speed')) || 0.2;
                const rect = el.getBoundingClientRect();

                // Se calcula solo cuando la tarjeta está en o cerca del campo de visión
                if (rect.top < windowH + 350 && rect.bottom > -350) {
                    const offsetFromCenter = (windowH / 2) - (rect.top + rect.height / 2);
                    const translateY = offsetFromCenter * speed;

                    const isCentered = el.classList.contains('center-x') || el.id === 'speeder-water-rush';
                    const xBase = isCentered ? '-50%' : '0px';
                    const mouseShiftX = (mouseX * speed * 45).toFixed(1);

                    el.style.transform = `translate3d(calc(${xBase} + ${mouseShiftX}px), ${translateY.toFixed(1)}px, 0)`;
                }
            });

            requestAnimationFrame(updateParallax);
        }

        // Iniciar loop de animación fluida
        requestAnimationFrame(updateParallax);

        // NAVEGACIÓN SUAVE POR PUNTOS DE PROFUNDIDAD
        function scrollToY(y) {
            window.scrollTo({
                top: y,
                behavior: 'smooth'
            });
        }

        // FUNCIONALIDAD LIGHTBOX (AMPLIAR ILUSTRACIONES)
        const modal = document.getElementById('lightboxModal');
        const modalImg = document.getElementById('lightboxImg');
        const modalCaption = document.getElementById('lightboxCaption');

        function openLightbox(src, caption) {
            if (!modal || !modalImg) return;
            modalImg.src = src;
            modalCaption.textContent = caption || '';
            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox() {
            if (!modal) return;
            modal.classList.remove('active');
            document.body.style.overflow = '';
            setTimeout(() => {
                if (modalImg) modalImg.src = '';
            }, 300);
        }

        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && modal.classList.contains('active')) {
                closeLightbox();
            }
        });
    </script>
